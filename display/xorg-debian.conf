Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "MaxClients" "64"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "Memory"
    Driver "dummy"
    VideoRam 4096
EndSection

Section "Monitor"
    Identifier "ED060XD4"
    DisplaySize 90 122
    HorizSync 20-100
    VertRefresh 30-75
    Modeline "760x1024" 58.00 760 800 880 960 1024 1027 1031 1050
    Option "PreferredMode" "760x1024"
EndSection

Section "Screen"
    Identifier "PocketBook"
    Device "Memory"
    Monitor "ED060XD4"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "760x1024"
        Virtual 760 1024
    EndSubSection
    SubSection "Display"
        Depth 24
        Modes "760x1024"
        Virtual 760 1024
    EndSubSection
EndSection

Section "Module"
    # GLX is already disabled below; avoid loading its shared module too.
    Disable "glx"
EndSection

Section "Extensions"
    Option "Composite" "Disable"
    Option "GLX" "Disable"
EndSection
