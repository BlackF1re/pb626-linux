name: E Ink preclear experiment
on:
  pull_request:
    paths:
      - 'experiments/eink-preclear/**'
      - '.github/workflows/eink-preclear-experiment.yml'
      - 'BT0-uncaged/transport.ps1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preclear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install runner-only ARM emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Build and test pinned ARMv7 bridge
        run: |
          set -euo pipefail
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo bash experiments/eink-preclear/build.sh
          sudo chown -R "$(id -u):$(id -g)" experiments/eink-preclear/out
      - name: Package experiment and provenance
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r experiments/eink-preclear/out dist/
          cp experiments/eink-preclear/{install.ps1,stage.sh,README.md} dist/
          cp BT0-uncaged/transport.ps1 dist/
          (cd dist/out && sha256sum -c SHA256SUMS)
          git rev-parse HEAD > dist/BUILD-COMMIT
          printf '%s\n' c40c8f325f3095e9846920dbb08b02726fbebe81 > dist/SOURCE-COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-preclear-experiment
          path: dist/
          if-no-files-found: error
