name: Megi E Ink desktop RAM image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/megi-desktop.yml'
      - 'display/pb626-desktop'
      - 'display/pb626-xsession'
      - 'display/pb626-x11-epd.c'
      - 'display/test-pb626-x11-epd.c'
      - 'display/eink-fonts.conf'
      - 'display/extras/**'
      - 'display/matchbox-keyboard-eink.patch'
      - 'display/matchbox-panel-power-supply.patch'
      - 'display/xorg.conf'
      - 'display/matchbox/**'
      - 'scripts/build-megi-desktop.sh'
      - 'scripts/fel-boot.sh'
      - 'scripts/Start-PB626.ps1'
      - 'scripts/Start-PB626Desktop.ps1'
  pull_request:
    paths:
      - '.github/workflows/megi-desktop.yml'
      - 'scripts/build-megi-desktop.sh'
  workflow_run:
    workflows: [Megi mainline Linux 7.2 RAM Linux]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Successful Megi 7.2 FEL bundle workflow run
        type: string
      desktop_run_id:
        description: Reuse the userspace of this successful desktop workflow run
        type: string

concurrency:
  group: megi-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The workflow_run event executes on main; pin its source snapshot
          # to the exact revision that produced the successful kernel bundle.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Select verified FEL kernel run
        id: kernel
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN: ${{ inputs.kernel_run_id || github.event.workflow_run.id }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')
            if grep -Eq '^display/(pb626-epd\.[ch]|test-pb626-epd\.c)$' <<< "$changed"; then
              echo 'Waiting for megi-fel.yml to trigger the paired desktop build.'
              echo 'deferred=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ -z "$KERNEL_RUN" ]; then
            KERNEL_RUN=$(gh run list --workflow megi-fel.yml --branch main --status success \
              --json databaseId,event --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | .[0].databaseId // empty')
          fi
          if [ -z "$KERNEL_RUN" ]; then
            echo "::error::No verified main-branch FEL bundle available. Run megi-fel first."
            exit 1
          fi
          echo "run_id=$KERNEL_RUN" >> "$GITHUB_OUTPUT"
      - name: Reuse verified Desktop userland
        id: desktop-cache
        if: steps.kernel.outputs.deferred != 'true' && inputs.desktop_run_id == ''
        uses: actions/cache@v4
        with:
          # Only cache the completed base userland. The current bundle's
          # kernel modules and E Ink worker are always installed afresh,
          # and the X11 bridge is always recompiled.
          path: desktop-cache
          key: pb626-desktop-root-v1-${{ runner.os }}-${{ hashFiles('scripts/build-megi-desktop.sh', 'scripts/build-alpine-rootfs.sh', 'scripts/assemble-megi-ram.sh', 'scripts/inspect-live.sh', 'scripts/pb626-network.sh', 'scripts/configure-megi-kernel.sh', '.github/workflows/megi-fel.yml', 'boot/**', 'board/megi/**', 'patches/**', 'display/matchbox-keyboard-eink.patch', 'display/matchbox-panel-power-supply.patch') }}
      - uses: actions/download-artifact@v4
        if: steps.kernel.outputs.deferred != 'true'
        with:
          name: pb626-mainline-7.2-ram-bundle
          run-id: ${{ steps.kernel.outputs.run_id }}
          github-token: ${{ github.token }}
          path: fel-bundle
      - uses: actions/download-artifact@v4
        if: steps.kernel.outputs.deferred != 'true' && inputs.desktop_run_id != ''
        with:
          name: pb626-megi-eink-desktop
          run-id: ${{ inputs.desktop_run_id }}
          github-token: ${{ github.token }}
          path: previous-desktop
      - name: Install ARM emulator and packaging tools
        if: steps.kernel.outputs.deferred != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio device-tree-compiler ncurses-bin
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Build Alpine Xorg and Matchbox desktop
        if: steps.kernel.outputs.deferred != 'true'
        run: |
          if [ -d previous-desktop ]; then
            bash scripts/build-megi-desktop.sh fel-bundle previous-desktop
          elif [ -s desktop-cache/pb626-desktop-root.cpio.gz ]; then
            bash scripts/build-megi-desktop.sh fel-bundle desktop-cache
          else
            bash scripts/build-megi-desktop.sh fel-bundle
          fi
      - name: Prepare Desktop userland for future cache hits
        if: steps.kernel.outputs.deferred != 'true' && inputs.desktop_run_id == '' && steps.desktop-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p desktop-cache
          cp dist/pb626-desktop-root.cpio.gz desktop-cache/
          (cd desktop-cache && sha256sum pb626-desktop-root.cpio.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.kernel.outputs.deferred != 'true'
        with:
          name: pb626-megi-eink-desktop
          path: dist/
          if-no-files-found: error
      - name: Package optional disk applications
        if: steps.kernel.outputs.deferred != 'true'
        run: tar -czf pb626-desktop-extras.tar.gz -C display/extras .
      - uses: actions/upload-artifact@v4
        if: steps.kernel.outputs.deferred != 'true'
        with:
          name: pb626-desktop-extras
          path: pb626-desktop-extras.tar.gz
          if-no-files-found: error
