name: PocketBook 626 U-Boot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uboot.yml'
      - 'boot/pb626-uboot-entry.S'
      - 'boot/pb626-emmc-init.c'
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Successful RAM bundle run whose eMMC kernel to include
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CROSS_COMPILE: arm-linux-gnueabihf-
      UBOOT_REV: 96c08df75f632622c57954940d6a1a6c20062e18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.kernel_run_id != ''
        with:
          name: pb626-mainline-7.2-ram-bundle
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ github.token }}
          path: kernel-bundle
      - name: Build Megi U-Boot for the PocketBook
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross bc bison flex libssl-dev \
            python3-pyelftools python3-setuptools device-tree-compiler cpio
          git init u-boot
          git -C u-boot fetch --depth=1 https://codeberg.org/megi/u-boot.git "$UBOOT_REV"
          git -C u-boot checkout --detach FETCH_HEAD
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REV"
          # Megi's clock change left a stale local variable in the divider update.
          sed -i '/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;/{N;s/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;\n[[:blank:]]*writel(rval, \&priv->reg->clkcr);/clrbits_le32(\&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);/;}' u-boot/drivers/mmc/sunxi_mmc.c
          grep -F 'clrbits_le32(&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);' u-boot/drivers/mmc/sunxi_mmc.c
          make -C u-boot pocketbook_touch_lux_3_defconfig
          sed -i -E '/^(# )?CONFIG_(SYS_TEXT_BASE|USE_BOOTCOMMAND|BOOTCOMMAND|CMD_GPIO|CMD_I2C|ENV_IS_NOWHERE|ENV_IS_IN_MMC|ENV_IS_IN_FAT|ENV_IS_IN_SPI_FLASH)(=| is not set)/d' u-boot/.config
          cat >> u-boot/.config <<'EOF'
          CONFIG_SYS_TEXT_BASE=0x4a000000
          CONFIG_USE_BOOTCOMMAND=y
          CONFIG_CMD_GPIO=y
          CONFIG_CMD_I2C=y
          CONFIG_BOOTCOMMAND="if i2c dev 0; then i2c mw 0x34 0x0e 0x62 1; fi; gpio clear PE8; if itest.l *0x42000024 == 0x016f2818 && itest.l *0x44800000 == 0xedfe0dd0; then i2c mw 0x34 0x0e 0x65 1; setenv fdt_high 0xffffffff; setenv initrd_high 0xffffffff; setenv bootargs console=ttyS0,115200 root=/dev/mmcblk2p1 rootfstype=ext4 rw; bootz 0x42000000 0x45000000:0x60000 0x44800000; i2c mw 0x34 0x0e 0x6f 1; elif fatload mmc 1:2 0x42000000 linux/bImage; then i2c mw 0x34 0x0e 0x63 1; bootz 0x42000000; i2c mw 0x34 0x0e 0x6f 1; else i2c mw 0x34 0x0e 0x6e 1; fi"
          CONFIG_ENV_IS_NOWHERE=y
          # CONFIG_ENV_IS_IN_MMC is not set
          # CONFIG_ENV_IS_IN_FAT is not set
          # CONFIG_ENV_IS_IN_SPI_FLASH is not set
          EOF
          make -C u-boot olddefconfig
          grep -Fx 'CONFIG_SYS_TEXT_BASE=0x4a000000' u-boot/.config
          grep -Fx 'CONFIG_SPL=y' u-boot/.config
          grep -F 'fatload mmc 1:2 0x42000000 linux/bImage' u-boot/.config
          grep -Fx 'CONFIG_CMD_BOOTZ=y' u-boot/.config
          grep -Fx 'CONFIG_OF_LIBFDT=y' u-boot/.config
          grep -Fx 'CONFIG_CMD_I2C=y' u-boot/.config
          grep -Fx 'CONFIG_CMD_ITEST=y' u-boot/.config
          grep -Fx 'CONFIG_CMD_SLEEP=y' u-boot/.config
          make -C u-boot -j"$(nproc)"
          mkdir dist
          cp u-boot/u-boot-sunxi-with-spl.bin dist/
          test "$(dd if=dist/u-boot-sunxi-with-spl.bin bs=1 skip=4 count=8 status=none)" = 'eGON.BT0'
          test "$(stat -c '%s' dist/u-boot-sunxi-with-spl.bin)" -le $((0x100000))
          touch factory-kernel.bin factory-dtb.bin factory-initrd.bin
          if test -d kernel-bundle; then
            (cd kernel-bundle && sha256sum -c SHA256SUMS)
            cp kernel-bundle/pb626-megi-zImage factory-kernel.bin
            test -s factory-kernel.bin
            cp kernel-bundle/pb626-elan-emmc-backup.dtb native.dtb
            fdtput -d native.dtb /chosen pb626,emmc-backup
            fdtput -t x native.dtb /chosen pb626,emmc-root
            fdtput -t x native.dtb /chosen linux,initrd-end 45060000
            fdtput -t s native.dtb /chosen bootargs \
              'console=ttyS0,115200 root=/dev/mmcblk2p1 rootfstype=ext4 rw'
            dtc -q -I dtb -O dtb -p 4096 -o factory-dtb.bin native.dtb
            mkdir -p early-root/{dev,sys,newroot}
            "${CROSS_COMPILE}gcc" -Os -Wall -Wextra -static -s boot/pb626-emmc-init.c -o early-root/init
            (cd early-root && find . -print0 | cpio --null -o -H newc --owner=0:0 --quiet) \
              | gzip -9 > factory-initrd.bin
            test "$(stat -c '%s' factory-initrd.bin)" -le $((0x60000))
            truncate -s $((0x60000)) factory-initrd.bin
          fi
          "${CROSS_COMPILE}as" boot/pb626-uboot-entry.S -o uboot-entry.o
          "${CROSS_COMPILE}ld" -Ttext=0x40008000 -e _start uboot-entry.o -o uboot-entry.elf
          "${CROSS_COMPILE}objcopy" -O binary -j .text uboot-entry.elf dist/bImage
          test "$(stat -c '%s' dist/bImage)" -lt $((0x800000))
          if test -d kernel-bundle; then
            "${CROSS_COMPILE}as" --defsym DIRECT_KERNEL=1 boot/pb626-uboot-entry.S -o direct-entry.o
            "${CROSS_COMPILE}ld" -Ttext=0x40008000 -e _start direct-entry.o -o direct-entry.elf
            "${CROSS_COMPILE}objcopy" -O binary -j .text direct-entry.elf dist/bImage-direct
            test "$(stat -c '%s' dist/bImage-direct)" -lt $((0x800000))
          fi
          (cd dist && sha256sum bImage* u-boot-sunxi-with-spl.bin > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-uboot-bimage
          path: dist/
          if-no-files-found: error
