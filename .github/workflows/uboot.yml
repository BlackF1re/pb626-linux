name: PocketBook 626 U-Boot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uboot.yml'
      - 'boot/pb626-uboot-entry.S'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CROSS_COMPILE: arm-linux-gnueabihf-
      UBOOT_REV: 96c08df75f632622c57954940d6a1a6c20062e18
    steps:
      - uses: actions/checkout@v4
      - name: Build Megi U-Boot for the PocketBook
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf bc bison flex libssl-dev python3-pyelftools python3-setuptools
          git init u-boot
          git -C u-boot fetch --depth=1 https://codeberg.org/megi/u-boot.git "$UBOOT_REV"
          git -C u-boot checkout --detach FETCH_HEAD
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REV"
          # Megi's clock change left a stale local variable in the divider update.
          sed -i '/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;/{N;s/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;\n[[:blank:]]*writel(rval, \&priv->reg->clkcr);/clrbits_le32(\&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);/;}' u-boot/drivers/mmc/sunxi_mmc.c
          grep -F 'clrbits_le32(&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);' u-boot/drivers/mmc/sunxi_mmc.c
          make -C u-boot pocketbook_touch_lux_3_defconfig
          sed -i -E '/^(# )?CONFIG_(SYS_TEXT_BASE|USE_BOOTCOMMAND|BOOTCOMMAND|CMD_GPIO|CMD_I2C|ENV_IS_NOWHERE|ENV_IS_IN_MMC|ENV_IS_IN_FAT|ENV_IS_IN_SPI_FLASH)(=| is not set)/d' u-boot/.config
          cat >> u-boot/.config <<'EOF'
          CONFIG_SYS_TEXT_BASE=0x4a000000
          CONFIG_USE_BOOTCOMMAND=y
          CONFIG_CMD_GPIO=y
          CONFIG_CMD_I2C=y
          CONFIG_BOOTCOMMAND="if i2c dev 0; then i2c mw 0x34 0x0e 0x62 1; fi; gpio clear PE8; sleep 2; gpio set PE8; sleep 2; if fatload mmc 1:2 0x42000000 linux/bImage; then i2c mw 0x34 0x0e 0x63 1; gpio clear PE8; sleep 2; gpio set PE8; bootz 0x42000000; i2c mw 0x34 0x0e 0x6f 1; else i2c mw 0x34 0x0e 0x6e 1; fi; gpio clear PE8"
          CONFIG_ENV_IS_NOWHERE=y
          # CONFIG_ENV_IS_IN_MMC is not set
          # CONFIG_ENV_IS_IN_FAT is not set
          # CONFIG_ENV_IS_IN_SPI_FLASH is not set
          EOF
          make -C u-boot olddefconfig
          grep -Fx 'CONFIG_SYS_TEXT_BASE=0x4a000000' u-boot/.config
          grep -Fx 'CONFIG_SPL=y' u-boot/.config
          grep -F 'fatload mmc 1:2 0x42000000 linux/bImage' u-boot/.config
          grep -Fx 'CONFIG_CMD_BOOTZ=y' u-boot/.config
          grep -Fx 'CONFIG_CMD_I2C=y' u-boot/.config
          grep -Fx 'CONFIG_CMD_SLEEP=y' u-boot/.config
          make -C u-boot -j"$(nproc)"
          mkdir dist
          cp u-boot/u-boot-sunxi-with-spl.bin dist/
          test "$(dd if=dist/u-boot-sunxi-with-spl.bin bs=1 skip=4 count=8 status=none)" = 'eGON.BT0'
          test "$(stat -c '%s' dist/u-boot-sunxi-with-spl.bin)" -le $((0x100000))
          "${CROSS_COMPILE}as" boot/pb626-uboot-entry.S -o uboot-entry.o
          "${CROSS_COMPILE}ld" -Ttext=0x40008000 -e _start uboot-entry.o -o uboot-entry.elf
          "${CROSS_COMPILE}objcopy" -O binary -j .text uboot-entry.elf dist/bImage
          test "$(stat -c '%s' dist/bImage)" -lt $((0x800000))
          (cd dist && sha256sum bImage u-boot-sunxi-with-spl.bin > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-uboot-bimage
          path: dist/
          if-no-files-found: error
