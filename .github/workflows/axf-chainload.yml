name: PocketBook stock boot.axf -> standalone U-Boot (experiment)

on:
  push:
    branches: [experiment/stock-axf-uboot-chainload]
    paths:
      - '.github/workflows/axf-chainload.yml'
      - 'boot/pb626-uboot-entry.S'
      - 'boot/pb626-uboot-linux.c'
      - 'boot/pb626-emmc-init.c'
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Successful Megi RAM bundle workflow run ID"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  chainload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CROSS_COMPILE: arm-linux-gnueabihf-
      UBOOT_REV: 96c08df75f632622c57954940d6a1a6c20062e18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          run-id: ${{ inputs.kernel_run_id || '45002994505' }}
          github-token: ${{ github.token }}
          path: kernel-bundle
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross bc bison flex libssl-dev cpio \
            python3-pyelftools python3-setuptools device-tree-compiler
      - name: Build standalone U-Boot for factory AXF handoff
        run: |
          set -euo pipefail
          git init u-boot
          git -C u-boot fetch --depth=1 https://codeberg.org/megi/u-boot.git "$UBOOT_REV"
          git -C u-boot checkout --detach FETCH_HEAD
          test "$(git -C u-boot rev-parse HEAD)" = "$UBOOT_REV"
          sed -i '/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;/{N;s/rval &= ~SUNXI_MMC_CLK_DIVIDER_MASK;\n[[:blank:]]*writel(rval, \&priv->reg->clkcr);/clrbits_le32(\&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);/;}' u-boot/drivers/mmc/sunxi_mmc.c
          grep -Fq 'clrbits_le32(&priv->reg->clkcr, SUNXI_MMC_CLK_DIVIDER_MASK);' u-boot/drivers/mmc/sunxi_mmc.c
          cp boot/pb626-uboot-linux.c u-boot/cmd/pb626_linux.c
          cat >> u-boot/cmd/Makefile <<'EOF'

          ifndef CONFIG_SPL_BUILD
          obj-y += pb626_linux.o
          endif
          EOF
          make -C u-boot pocketbook_touch_lux_3_defconfig
          sed -i -E '/^(# )?CONFIG_(SYS_TEXT_BASE|USE_BOOTCOMMAND|BOOTCOMMAND|CMD_I2C|ENV_IS_NOWHERE|ENV_IS_IN_MMC|ENV_IS_IN_FAT|ENV_IS_IN_SPI_FLASH)(=| is not set)/d' u-boot/.config
          cat >>u-boot/.config <<'EOF'
          CONFIG_SYS_TEXT_BASE=0x4a000000
          CONFIG_USE_BOOTCOMMAND=y
          CONFIG_CMD_I2C=y
          CONFIG_ENV_IS_NOWHERE=y
          # CONFIG_ENV_IS_IN_MMC is not set
          # CONFIG_ENV_IS_IN_FAT is not set
          # CONFIG_ENV_IS_IN_SPI_FLASH is not set
          CONFIG_BOOTCOMMAND="if i2c dev 0; then i2c mw 0x34 0x0e 0x72 1; fi; pb626_linux; i2c mw 0x34 0x0e 0x79 1"
          EOF
          make -C u-boot olddefconfig
          grep -Fxq 'CONFIG_SYS_TEXT_BASE=0x4a000000' u-boot/.config
          grep -Fxq 'CONFIG_CMD_I2C=y' u-boot/.config
          grep -Fxq 'CONFIG_HUSH_PARSER=y' u-boot/.config
          grep -Fxq 'CONFIG_OF_LIBFDT=y' u-boot/.config
          make -C u-boot -j"$(nproc)"
          mkdir -p dist/linux
          cp u-boot/u-boot.bin dist/linux/u-boot.bin
          test -s dist/linux/u-boot.bin
          test "$(stat -c %s dist/linux/u-boot.bin)" -le $((0x80000))
          # boot.axf requests exactly this segment size; zero-pad the file.
          truncate -s $((0x80000)) dist/linux/u-boot.bin
          test "$(stat -c %s dist/linux/u-boot.bin)" -eq $((0x80000))
      - name: Package the factory AXF payload
        run: |
          set -euo pipefail
          (cd kernel-bundle && sha256sum -c SHA256SUMS)
          cp kernel-bundle/pb626-megi-zImage dist/linux/pb626-zImage
          # The FEL zImage has a four-byte appended-DTB sentinel.
          # Recover the exact eMMC-specific DTB from the same run's bImage.
          tar -xOf kernel-bundle/pb626-emmc-boot.tar.gz bImage > original-bImage
          kernel_size=$(stat -c %s kernel-bundle/pb626-megi-zImage)
          dd if=original-bImage of=native.dtb bs=1 skip=$((kernel_size - 4)) status=none
          fdtget native.dtb /chosen pb626,emmc-root >/dev/null
          fdtget native.dtb /chosen pb626,display-bringup >/dev/null
          mkdir -p early-root/{dev,sys,newroot}
          "${CROSS_COMPILE}gcc" -Os -Wall -Wextra -static -s \
            boot/pb626-emmc-init.c -o early-root/init
          (cd early-root && find . -print0 | cpio --null -o -H newc --owner=0:0 --quiet) \
            | gzip -9 > factory-initrd.bin
          initrd_end=$((0x45000000 + $(stat -c %s factory-initrd.bin)))
          fdtput -t x native.dtb /chosen linux,initrd-start 45000000
          fdtput -t x native.dtb /chosen linux,initrd-end "$(printf '%x' "$initrd_end")"
          fdtput -t s native.dtb /chosen bootargs \
            'console=ttyS0,115200 root=/dev/mmcblk2p1 rootfstype=ext4 rootwait rw init=/sbin/pb626-emmc-init'
          dtc -q -I dtb -O dtb -p 4096 -o dist/linux/pb626.dtb native.dtb
          test "$(fdtget -t s dist/linux/pb626.dtb /soc/mmc@1c11000 status)" = okay
          fdtget -t x dist/linux/pb626.dtb /memory@40000000 reg
          cp dist/linux/pb626-zImage factory-kernel.bin
          cp dist/linux/pb626.dtb factory-dtb.bin
          "${CROSS_COMPILE}as" --defsym STANDALONE_AXF=1 --defsym AXF_EMBEDDED_LINUX=1 boot/pb626-uboot-entry.S -o axf-entry.o
          "${CROSS_COMPILE}ld" -Ttext=0x40008000 -e _start axf-entry.o -o axf-entry.elf
          "${CROSS_COMPILE}objcopy" -O binary -j .text axf-entry.elf dist/linux/pb626ax.bin
          test "$(stat -c %s dist/linux/pb626ax.bin)" -le $((0x800000))
          truncate -s $((0x800000)) dist/linux/pb626ax.bin
          (cd dist && sha256sum linux/* > SHA256SUMS)
          cat >dist/README.txt <<'EOF'
          EXPERIMENT ONLY. NO IMAGE IS AUTOMATICALLY INSTALLED.
          Preserve the stock BT0, BT1, boot.axf and factory backups.
          Keep the stock [segment] address and limit. Set img_name to
          c:\linux\pb626ax.bin. It contains standalone U-Boot, the Linux
          kernel, its p1 DTB, and a small initramfs that mounts p1.
          AXP209 register 0x0e records 0x71 (shim), 0x72 (U-Boot autoboot),
          0x78 (Linux handoff) or 0x79 (the U-Boot command failed/returned).
          0x7a (early userspace), 0x7b (p1 mounted), 0x7c (p1 unavailable),
          0x7d (early setup, switch-root, or exec failed) are written by Linux.
          The original factory linux.ini and recovery settings must be retained.
          The factory loader's behavior with this specific board is NOT verified.
          The eMMC partition p1 MUST contain the expected Alpine rootfs and
          executable /sbin/pb626-emmc-init before attempting this boot.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-stock-axf-chainload-experiment
          path: dist/
          if-no-files-found: error
