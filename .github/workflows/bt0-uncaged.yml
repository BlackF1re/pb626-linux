name: BT0-uncaged

on:
  workflow_dispatch:
    inputs:
      base_spl_b64:
        description: "Exact original 24576-byte PB626 SPL (base64, no line breaks)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bt0-uncaged-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM assembler and linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build and test exact known-good SPL
        env:
          BASE_SPL_B64: ${{ inputs.base_spl_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$BASE_SPL_B64" | base64 -d > "$RUNNER_TEMP/base-spl.bin"
          unset BASE_SPL_B64
          mkdir -p dist
          python3 BT0-uncaged/build.py "$RUNNER_TEMP/base-spl.bin" dist/BT0-uncaged.bin
          python3 BT0-uncaged/test_hook.py dist/BT0-uncaged.bin
          cp BT0-uncaged/README.md dist/
          cp BT0-uncaged/{build.py,early-menu.S,test_hook.py,pack-kernel.py,kernel-entry.S} dist/
          (cd dist && sha256sum BT0-uncaged.bin README.md build.py early-menu.S test_hook.py pack-kernel.py kernel-entry.S > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: BT0-uncaged
          path: dist/
          if-no-files-found: error
