name: Source-built PocketBook bootloader candidates
on:
  push:
    branches: [enhance/native-reliability]
    paths:
      - 'BT0-uncaged/build-from-source.sh'
      - 'BT0-uncaged/prepare-source-hook.py'
      - 'BT0-uncaged/prepare-source-led.py'
      - 'BT0-uncaged/pb626-led.*'
      - 'BT0-uncaged/led-morse.h'
      - 'BT0-uncaged/emulator/**'
      - 'BT0-uncaged/prepare-source-resume.py'
      - 'BT0-uncaged/fel-entry.S'
      - 'BT0-uncaged/early-menu.S'
      - 'patches/sunxi-fel-keep-mmu-off.patch'
      - '.github/workflows/source-bootloader.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross bc bison flex libssl-dev python3-pyelftools \
            python3-setuptools device-tree-compiler libusb-1.0-0-dev libfdt-dev zlib1g-dev pkg-config
      - name: Fingerprint toolchain
        id: tools
        run: |
          fingerprint=$(dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross libusb-1.0-0-dev libfdt-dev | sha256sum | cut -c1-20)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: source-boot-candidates
          key: pb626-source-spl-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.fingerprint }}-${{ hashFiles('BT0-uncaged/build-from-source.sh', 'BT0-uncaged/prepare-source-hook.py', 'BT0-uncaged/prepare-source-led.py', 'BT0-uncaged/pb626-led.c', 'BT0-uncaged/pb626-led.h', 'BT0-uncaged/led-morse.h', 'BT0-uncaged/prepare-source-resume.py', 'BT0-uncaged/early-menu.S', 'BT0-uncaged/fel-entry.S', 'patches/sunxi-fel-keep-mmu-off.patch') }}
      - name: Build independently from pinned source
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash BT0-uncaged/build-from-source.sh source-boot-candidates
      - name: Verify both candidate manifests
        run: |
          (cd source-boot-candidates && sha256sum -c SHA256SUMS)
          (cd source-boot-candidates/deep-resume && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-source-boot-candidates-NOT-FOR-FLASH
          path: source-boot-candidates/
          if-no-files-found: error
