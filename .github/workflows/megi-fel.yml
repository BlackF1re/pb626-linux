name: Build native Linux and FEL recovery

# Main produces release artifacts. Feature branches build via Run workflow
# or the explicitly requested Debian-only caller workflow.
# Lightweight CI still checks PR commits.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/megi-fel.yml'
      - 'scripts/build-alpine-rootfs.sh'
      - 'scripts/configure-megi-kernel.sh'
      - 'scripts/build-megi-kernel.sh'
      - 'scripts/build-megi-variants.sh'
      - 'scripts/assemble-megi-ram.sh'
      - 'scripts/build-desktop-base.sh'
      - 'scripts/build-megi-desktop.sh'
      - 'scripts/build-native-rootfs.sh'
      - 'scripts/build-debian-rootfs.sh'
      - 'scripts/build-debian-base.sh'
      - 'scripts/compile-debian-native.sh'
      - 'diagnostics/**'
      - 'BT0-uncaged/**'
      - '.github/workflows/source-bootloader.yml'
      - '.github/workflows/fel-host.yml'
      - 'scripts/Start-PB626*.ps1'
      - 'scripts/fel-boot.sh'
      - 'scripts/inspect-live.sh'
      - 'scripts/probe-device.sh'
      - 'scripts/pb626-network.sh'
      - 'BT0-uncaged/pack-kernel.py'
      - 'BT0-uncaged/kernel-entry.S'
      - 'board/**'
      - 'boot/**'
      - 'display/**'
      - 'patches/a13-mbus-dma-devlink.patch'
      - 'patches/ektf2227-pocketbook-touch.patch'
      - 'patches/pwm-backlight-disconnect-when-off.patch'
      - 'patches/sun5i-eink-runtime-pm.patch'
      - 'patches/sun4i-lradc-system-pm.patch'
      - 'patches/axp209-boot-source.patch'
      - 'scripts/build-debian-recovery.sh'
      - 'scripts/prepare-install.sh'
      - 'scripts/prepare-fel-inputs.py'
      - 'patches/sunxi-fel-keep-mmu-off.patch'
      - 'scripts/installer/**'
      - 'scripts/restore/**'
      - 'boot/recovery/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      debian_only:
        description: Build only the Debian native image and recovery kit
        type: boolean
        default: false

concurrency:
  group: megi-fel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alpine-base:
    if: ${{ !inputs.debian_only }}
    name: Alpine ARMv7 base (independent cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore Alpine base filesystem cache
        id: cache
        uses: actions/cache@v4
        with:
          path: alpine-cache/alpine-rootfs.tar.gz
          key: pb626-alpine-armv7-v3.24.4-${{ runner.os }}-${{ hashFiles('scripts/build-alpine-rootfs.sh') }}
      - name: Install emulator for Alpine setup on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Assemble Alpine base on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-alpine-rootfs.sh
      - name: Verify Alpine archive
        run: |
          set -euo pipefail
          test -s alpine-cache/alpine-rootfs.tar.gz
          gzip -t alpine-cache/alpine-rootfs.tar.gz
          tar -tzf alpine-cache/alpine-rootfs.tar.gz | grep -F './sbin/apk' >/dev/null
          echo "Alpine cache hit: ${{ steps.cache.outputs.cache-hit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-alpine-base-stage
          path: alpine-cache/alpine-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1

  kernel:
    name: Megi kernel + DTBs (prebuilt cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and DT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc-arm-linux-gnueabihf libc6-dev-armhf-cross make bc bison flex \
            libssl-dev libelf-dev device-tree-compiler libncurses-dev lz4 kmod
      - name: Validate ARM static-link toolchain before downloading the kernel
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' |
            arm-linux-gnueabihf-gcc -x c -static - -o /tmp/pb626-toolchain-smoke
          test -s /tmp/pb626-toolchain-smoke
          file /tmp/pb626-toolchain-smoke | grep -q 'ARM'
      - name: Fingerprint the complete kernel build toolchain
        id: compiler
        run: |
          set -euo pipefail
          # Kconfig records GCC, assembler, linker, and Rust feature versions.
          # A GCC-only key can restore a non-reproducible .config.
          fingerprint=$(
            {
              arm-linux-gnueabihf-gcc --version | sed -n '1p'
              arm-linux-gnueabihf-as --version | sed -n '1p'
              arm-linux-gnueabihf-ld --version | sed -n '1p'
              gcc --version | sed -n '1p'
              rustc --version 2>/dev/null || echo 'rustc unavailable'
              dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
            } | sha256sum | cut -c1-20
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Toolchain fingerprint: $fingerprint"
      - name: Restore complete verified kernel/DTB/UAPI stage
        id: complete
        uses: actions/cache@v4
        with:
          path: kernel-complete
          key: pb626-megi-complete-v1-facc87117511221-${{ runner.os }}-${{ runner.arch }}-tool${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'scripts/configure-megi-kernel.sh', 'board/**', 'scripts/build-megi-variants.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch') }}
      - name: Restore prebuilt kernel and modules cache
        if: steps.complete.outputs.cache-hit != 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: kernel-cache
          key: pb626-megi-kernel-v3-facc87117511221-${{ runner.os }}-${{ runner.arch }}-tool${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'scripts/configure-megi-kernel.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch') }}
      - name: Fetch pinned Megi 7.2 source and verify A13 drivers
        if: steps.complete.outputs.cache-hit != 'true'
        run: bash scripts/build-megi-kernel.sh prepare
      - name: Verify cached Kconfig reproducibility
        if: steps.complete.outputs.cache-hit != 'true'
        id: kconfig
        run: |
          set -euo pipefail
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo 'No kernel cache: compile using the pinned source and current tools.'
            exit 0
          fi
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo '::warning::Cached kernel .config differs from current Kconfig; rebuilding kernel and modules together.'
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile zImage and all modules on cache miss or config drift
        if: steps.complete.outputs.cache-hit != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.kconfig.outputs.rebuild == 'true')
        run: bash scripts/build-megi-kernel.sh compile "${{ steps.kconfig.outputs.rebuild }}"
      - name: Check cached or newly compiled zImage, modules and USB contract
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          test -s kernel-cache/pb626-megi-zImage
          test -s kernel-cache/pb626-megi.config
          test -s kernel-cache/kernel-modules.tar.gz
          test -s kernel-cache/KERNELRELEASE
          test -s kernel-cache/KERNEL-SOURCE.txt
          gzip -t kernel-cache/kernel-modules.tar.gz
          grep -qx 'CONFIG_USB_MUSB_HDRC=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_MUSB_SUNXI=y' kernel-cache/pb626-megi.config
          bash scripts/configure-megi-kernel.sh --check kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_PHY_SUN4I_USB=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_EXTCON=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_CONFIGFS_ACM=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_CMA_SIZE_MBYTES=32' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_REGULATOR_TPS65185=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_DRM_LIMA=m' kernel-cache/pb626-megi.config
          for key in AUTO_ZRELADDR FB_SUN5I_EINK VIDEOBUF2_CORE VIDEOBUF2_V4L2 VIDEOBUF2_MEMOPS VIDEOBUF2_DMA_CONTIG; do
            grep -qx "CONFIG_$key=y" kernel-cache/pb626-megi.config
          done
          grep -Fq -- '-pb626-eink-builtin-mbusfix' kernel-cache/KERNELRELEASE
          tar -xOzf kernel-cache/kernel-modules.tar.gz "lib/modules/$(cat kernel-cache/KERNELRELEASE)/modules.builtin" > /tmp/pb626-modules.builtin
          grep -Fxq 'kernel/drivers/video/fbdev/sun5i-eink.ko' /tmp/pb626-modules.builtin
          echo "Prebuilt kernel cache hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Rebuilt for Kconfig drift: ${{ steps.kconfig.outputs.rebuild }}"
      - name: Restore validated DTBs
        if: steps.complete.outputs.cache-hit != 'true'
        id: dtbs
        uses: actions/cache@v4
        with:
          path: dtb-stage
          key: pb626-dtbs-v1-facc87117511221-${{ runner.os }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'kernel-cache/pb626-megi.config', 'board/**', 'scripts/build-megi-variants.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch') }}
      - name: Build current Device Trees on cache miss
        if: steps.complete.outputs.cache-hit != 'true' && steps.dtbs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo "::error::DTB Kconfig differs from the kernel that supplied zImage/modules"
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            exit 1
          fi
          mkdir -p dtb-stage
          bash scripts/build-megi-variants.sh linux dtb-stage "$PWD"
          (cd dtb-stage && sha256sum pb626-*.dtb > SHA256SUMS)
      - name: Verify DTB cache
        if: steps.complete.outputs.cache-hit != 'true'
        run: (cd dtb-stage && sha256sum -c SHA256SUMS)
      - name: Assemble portable kernel-stage artifact
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p kernel-stage
          cp kernel-cache/* kernel-stage/
          cp dtb-stage/pb626-*.dtb kernel-stage/
          install -D -m 0644 linux/include/uapi/linux/sun5i-eink.h kernel-stage/uapi/linux/sun5i-eink.h
          expected=$(printf '%s\n' pb626-{elan-display,elan-emmc-backup,elan-emmc-native}.dtb | LC_ALL=C sort)
          actual=$(find kernel-stage -maxdepth 1 -type f -name 'pb626-*.dtb' -printf '%f\n' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo '::error::Unexpected DTB set'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
      - name: Cache verified kernel/DTBs/UAPI without checkout identity or RAM worker
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          cp -a kernel-stage kernel-complete
          (cd kernel-complete && find . -type f ! -path ./SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Verify and reuse complete cache without fetching Linux source
        if: steps.complete.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          (cd kernel-complete && sha256sum -c SHA256SUMS)
          bash scripts/configure-megi-kernel.sh --check kernel-complete/pb626-megi.config
          cp -a kernel-complete kernel-stage
          rm kernel-stage/SHA256SUMS
      - name: Restore static RAM E Ink worker
        if: ${{ !inputs.debian_only }}
        id: ram-worker
        uses: actions/cache@v4
        with:
          path: ram-worker-cache
          key: pb626-ram-worker-v1-${{ runner.os }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('kernel-stage/uapi/linux/sun5i-eink.h', 'display/pb626-epd.c', 'display/pb626-epd.h', 'display/test-pb626-epd.c') }}
      - name: Test and compile the RAM E Ink utility on cache miss
        if: ${{ !inputs.debian_only && steps.ram-worker.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra -Werror -I kernel-stage/uapi \
            display/test-pb626-epd.c -o test-pb626-epd
          ./test-pb626-epd
          mkdir -p ram-worker-cache
          arm-linux-gnueabihf-gcc -O3 -Wall -Wextra -Werror -static -I kernel-stage/uapi \
            display/pb626-epd.c -o ram-worker-cache/pb626-epd
          (cd ram-worker-cache && sha256sum pb626-epd > SHA256SUMS)
      - name: Verify and stage the RAM E Ink utility
        if: ${{ !inputs.debian_only }}
        run: |
          set -euo pipefail
          (cd ram-worker-cache && sha256sum -c SHA256SUMS)
          cp ram-worker-cache/pb626-epd kernel-stage/
          test -s kernel-stage/pb626-epd
      - name: Stamp and hash paired kernel stage
        run: |
          git rev-parse HEAD > kernel-stage/BUILD-COMMIT
          (cd kernel-stage && find . -type f ! -path ./SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  bundle:
    name: Final RAM bundle (no kernel rebuild)
    runs-on: ubuntu-24.04
    needs: [kernel, alpine-base]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - name: Verify paired kernel stage
        run: |
          test "$(cat kernel-stage/BUILD-COMMIT)" = "$(git rev-parse HEAD)"
          (cd kernel-stage && sha256sum -c SHA256SUMS)
      - uses: actions/download-artifact@v4
        with:
          name: pb626-alpine-base-stage
          path: alpine-base
      - name: Install RAM packaging tools
        timeout-minutes: 9
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "APT setup attempt $attempt/2"
            if sudo timeout 180s apt-get -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update &&
               sudo timeout 240s apt-get -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends \
                  cpio device-tree-compiler e2fsprogs kmod zstd; then
              exit 0
            fi
            echo "APT setup attempt $attempt failed or timed out"
            sleep 5
          done
          exit 1
      - name: Use the verified ARM E Ink utility from the kernel stage
        run: |
          set -euo pipefail
          test -s kernel-stage/pb626-epd
          cp kernel-stage/pb626-epd pb626-epd
          chmod +x pb626-epd
      - name: Assemble full Alpine RAM image from independent stages
        run: bash scripts/assemble-megi-ram.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Paired RAM desktop and native firmware
    needs: [bundle, alpine-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          path: fel-bundle
      - uses: actions/download-artifact@v4
        with:
          name: pb626-alpine-base-stage
          path: alpine-base
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio device-tree-compiler ncurses-bin clang lld qemu-user-static
      - name: Identify desktop dependencies
        id: desktop-inputs
        run: |
          echo "alpine=$(sha256sum alpine-base/alpine-rootfs.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache distribution desktop base (no kernel or project runtime)
        id: cache
        uses: actions/cache@v4
        with:
          path: desktop-cache
          key: pb626-desktop-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.desktop-inputs.outputs.alpine }}-${{ hashFiles('scripts/build-desktop-base.sh', 'display/matchbox-keyboard-eink.patch', 'display/matchbox-panel-power-supply.patch') }}
      - name: Build Matchbox and Xorg on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-desktop-base.sh alpine-base/alpine-rootfs.tar.gz desktop-cache
      - name: Verify desktop base
        run: (cd desktop-cache && sha256sum -c SHA256SUMS)
      - name: Cache compiled display bridge and native worker
        uses: actions/cache@v4
        with:
          path: bridge-cache
          key: pb626-display-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop-cache/SHA256SUMS', 'scripts/build-megi-desktop.sh', 'display/pb626-epd.c', 'display/pb626-epd.h', 'display/pb626-x11-epd.c', 'display/pb626-sleep.h', 'display/pb626-ddx-fb.h', 'display/test-pb626-*.c', 'fel-bundle/uapi/linux/sun5i-eink.h') }}
      - name: Assemble paired firmware from current FEL bundle and cached desktop
        run: bash scripts/build-megi-desktop.sh fel-bundle desktop-cache bridge-cache
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-megi-eink-desktop
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-native-system
          path: native-dist/
          if-no-files-found: error

  debian-base:
    name: Debian runtime and compiler chroots (independent cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache epoch (weekly Debian security refresh)
        id: epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: base
        with:
          path: debian-base
          key: pb626-debian-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('scripts/build-debian-base.sh') }}
      - name: Install bootstrap tools on miss
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring qemu-user-static binfmt-support arch-test
          sudo update-binfmts --enable qemu-arm
          arch-test armhf
      - name: Build base on cache miss
        if: steps.base.outputs.cache-hit != 'true'
        run: bash scripts/build-debian-base.sh debian-base
      - name: Check base integrity
        run: (cd debian-base && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-debian-base-stage
          path: debian-base/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  bootloader:
    uses: ./.github/workflows/source-bootloader.yml
    secrets: inherit

  fel-host:
    uses: ./.github/workflows/fel-host.yml

  diagnostics:
    name: Terminal diagnostics (standalone)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - run: |
          sh -n diagnostics/pb626-diagnostics
          sh diagnostics/pb626-diagnostics --self-test
          mkdir diagnostic-dist
          install -m 755 diagnostics/pb626-diagnostics diagnostic-dist/pb626-diagnostics
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Werror -static -s diagnostics/pb626-diag-clock.c -o diagnostic-dist/pb626-diag-clock
          cp diagnostics/README.md diagnostic-dist/README.md
          git rev-parse HEAD > diagnostic-dist/BUILD-COMMIT
          (cd diagnostic-dist && sha256sum pb626-diagnostics pb626-diag-clock README.md BUILD-COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-diagnostics
          path: diagnostic-dist/
          if-no-files-found: error
          retention-days: 14

  debian-native:
    name: Debian 13 armhf native firmware candidate
    needs: [kernel, debian-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - name: Verify paired kernel stage
        run: |
          test "$(cat kernel-stage/BUILD-COMMIT)" = "$(git rev-parse HEAD)"
          (cd kernel-stage && sha256sum -c SHA256SUMS)
      - uses: actions/download-artifact@v4
        with:
          name: pb626-debian-base-stage
          path: debian-base
      - name: Restore complete validated native content
        id: native-content
        uses: actions/cache@v4
        with:
          path: debian-dist
          key: pb626-native-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('debian-base/SHA256SUMS', 'kernel-stage/pb626-megi-zImage', 'kernel-stage/pb626-elan-emmc-native.dtb', 'kernel-stage/kernel-modules.tar.gz', 'kernel-stage/pb626-megi.config', 'kernel-stage/KERNELRELEASE', 'kernel-stage/KERNEL-SOURCE.txt', 'kernel-stage/uapi/linux/sun5i-eink.h', 'scripts/build-debian-rootfs.sh', 'scripts/compile-debian-native.sh', 'scripts/configure-megi-kernel.sh', 'scripts/profile-memory.sh', 'scripts/inspect-live.sh', 'scripts/probe-device.sh', 'boot/debian/**', 'boot/native/**', 'boot/pb626-native-desktop', 'display/**', 'diagnostics/pb626-diagnostics', 'diagnostics/pb626-diag-clock.c', 'BT0-uncaged/pack-kernel.py', 'BT0-uncaged/kernel-entry.S', 'tests/check-control-center.tcl', 'LICENSE') }}
      - name: Install bootstrap and ARM execution tools
        if: steps.native-content.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring \
            qemu-user-static binfmt-support arch-test device-tree-compiler kmod ncurses-bin git clang lld
          command -v clang ld.lld
          sudo update-binfmts --enable qemu-arm
          test -r /proc/sys/fs/binfmt_misc/qemu-arm
          arch-test armhf
      - uses: actions/cache@v4
        if: steps.native-content.outputs.cache-hit != 'true'
        id: native-binaries
        with:
          path: debian-compiled-cache
          key: pb626-debian-compiled-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('debian-base/SHA256SUMS', 'kernel-stage/uapi/linux/sun5i-eink.h', 'scripts/compile-debian-native.sh', 'display/pb626-epd.c', 'display/pb626-epd.h', 'display/pb626-x11-epd.c', 'display/pb626-sleep.h', 'display/pb626-ddx-fb.h', 'display/test-pb626-epd.c', 'display/test-pb626-x11-epd.c', 'display/matchbox-keyboard-eink.patch', 'display/matchbox-panel-power-supply.patch', 'display/xorg-dummy-pb626-shared.patch', 'boot/debian/pb626-charge.c') }}
      - name: Build and verify Debian rootfs and paired firmware
        if: steps.native-content.outputs.cache-hit != 'true'
        run: bash scripts/build-debian-rootfs.sh kernel-stage debian-dist debian-base debian-compiled-cache
      - name: Verify cached content and bind to current assembly
        run: |
          set -euo pipefail
          (cd debian-dist && sha256sum -c SHA256SUMS)
          test -s debian-dist/CONTENT-BUILD-COMMIT
          git rev-parse HEAD > debian-dist/BUILD-COMMIT
          (cd debian-dist && sha256sum pb626-* KERNELRELEASE KERNEL-SOURCE.txt BUILD-COMMIT CONTENT-BUILD-COMMIT raw-linux.img DEBIAN-PACKAGES.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-native-debian13-armhf
          path: debian-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  recovery:
    name: Minimal Debian recovery (parallel with native rootfs)
    needs: [kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - name: Verify paired kernel stage
        run: |
          test "$(cat kernel-stage/BUILD-COMMIT)" = "$(git rev-parse HEAD)"
          (cd kernel-stage && sha256sum -c SHA256SUMS)
      - name: Install Debian recovery build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user cpio device-tree-compiler
      - name: Fingerprint recovery payload inputs
        id: recovery-tools
        run: |
          fingerprint=$(dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross | sha256sum | cut -c1-20)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: recovery-payload
        with:
          path: recovery-payload
          key: pb626-recovery-payload-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.recovery-tools.outputs.week }}-${{ steps.recovery-tools.outputs.fingerprint }}-${{ hashFiles('scripts/build-debian-recovery.sh', 'scripts/restore/pb626-restore-scan.c') }}
      - name: Build the minimal recovery
        run: bash scripts/build-debian-recovery.sh kernel-stage flash-kit recovery-payload
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-debian-recovery
          path: flash-kit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  flash-kit:
    name: Assemble same-run flash kit (no compilation)
    needs: [debian-native, recovery, diagnostics, fel-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-debian-recovery
          path: flash-kit
      - uses: actions/download-artifact@v4
        with:
          name: pb626-native-debian13-armhf
          path: native-stage
      - uses: actions/download-artifact@v4
        with:
          name: pb626-diagnostics
          path: flash-kit/diagnostics
      - uses: actions/download-artifact@v4
        with:
          name: pb626-fel-host-tools
          path: flash-kit/fel-host
      - name: Assemble paired installation, backup and restore kit
        run: |
          set -euo pipefail
          test "$(cat native-stage/BUILD-COMMIT)" = "$(cat flash-kit/recovery/BUILD-COMMIT)"
          test "$(cat native-stage/BUILD-COMMIT)" = "$(cat flash-kit/diagnostics/BUILD-COMMIT)"
          (cd native-stage && sha256sum -c SHA256SUMS)
          (cd flash-kit/recovery && sha256sum -c SHA256SUMS)
          (cd flash-kit/tools && sha256sum -c SHA256SUMS)
          (cd flash-kit/diagnostics && sha256sum -c SHA256SUMS)
          (cd flash-kit/fel-host && sha256sum -c SHA256SUMS)
          cp scripts/prepare-fel-inputs.py flash-kit/source/scripts/
          mv native-stage flash-kit/native
          cp docs/FLASH-KIT.md flash-kit/README.md
          (cd flash-kit && find . -type f ! -path ./SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd flash-kit && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-debian-flash-kit
          path: flash-kit/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
