name: PB626 Linux RAM and native eMMC

on:
  push:
    branches: [main, native-boot]
    paths:
      - '.github/workflows/megi-fel.yml'
      - 'board/megi/**'
      - 'boot/**'
      - 'display/**'
      - 'scripts/build-megi-variants.sh'
      - 'scripts/configure-megi-kernel.sh'
      - 'patches/**'
      - 'scripts/build-alpine-rootfs.sh'
      - 'scripts/assemble-megi-ram.sh'
      - 'scripts/probe-device.sh'
      - 'scripts/inspect-live.sh'
      - 'scripts/install-pb626-emmc.sh'
      - 'scripts/build-native-install.sh'
      - 'scripts/pb626-fat-contiguous.c'
      - 'scripts/build-megi-desktop.sh'
      - 'scripts/pb626-network.sh'
      - 'scripts/Start-PB626.ps1'
      - 'scripts/Start-PB626Desktop.ps1'
      - 'scripts/Install-PB626.ps1'
      - 'scripts/fel-boot.sh'
  pull_request:
    paths:
      - '.github/workflows/megi-fel.yml'
      - 'board/megi/**'
      - 'boot/**'
      - 'display/**'
      - 'scripts/build-megi-variants.sh'
      - 'scripts/configure-megi-kernel.sh'
      - 'patches/**'
      - 'scripts/build-alpine-rootfs.sh'
      - 'scripts/assemble-megi-ram.sh'
      - 'scripts/probe-device.sh'
      - 'scripts/inspect-live.sh'
      - 'scripts/install-pb626-emmc.sh'
      - 'scripts/build-native-install.sh'
      - 'scripts/pb626-fat-contiguous.c'
      - 'scripts/build-megi-desktop.sh'
      - 'scripts/pb626-network.sh'
      - 'scripts/Start-PB626.ps1'
      - 'scripts/Start-PB626Desktop.ps1'
      - 'scripts/Install-PB626.ps1'
      - 'scripts/fel-boot.sh'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Force full kernel and Desktop build instead of reusing compatible artifacts
        type: boolean
        default: false

concurrency:
  group: megi-fel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Check syntax and choose reusable artifacts
    runs-on: ubuntu-24.04
    outputs:
      reuse_run: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check scripts before starting any expensive job
        run: |
          set -euo pipefail
          bash -n scripts/build-native-install.sh
          bash -n scripts/assemble-megi-ram.sh
          bash -n scripts/build-megi-variants.sh
          bash -n scripts/build-megi-desktop.sh
          bash -n scripts/configure-megi-kernel.sh
          bash -n scripts/fel-boot.sh
          for f in boot/init-megi boot/pb626-native-setup boot/pb626-native-desktop boot/pb626-native-console scripts/install-pb626-emmc.sh; do
            sh -n "$f"
          done
      - name: Ensure YAML parser is available
        run: python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - name: Find compatible RAM and Desktop artifacts
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.rebuild || false }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo 'run_id=' >> "$GITHUB_OUTPUT"
          if [[ "$FORCE_REBUILD" == true || "$BRANCH" != native-boot ]]; then
            echo 'Full build requested or not on native-boot.'
            exit 0
          fi
          # A failed installer job can still have two fully uploaded inputs.
          # Reuse only an ancestor on this branch, with all upstream source
          # files identical. Ignore installer-only scripts and documentation.
          # The original failed run also predates this job-splitting change.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=native-boot&per_page=50" --jq '.workflow_runs[] | select(.path == ".github/workflows/megi-fel.yml" and .status == "completed") | [.id,.head_sha] | @tsv')
          while IFS=$'\t' read -r id sha; do
            [[ "$id" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git merge-base --is-ancestor "$sha" HEAD || continue
            if ! git diff --quiet "$sha" HEAD -- . \
                ':!scripts/build-native-install.sh' \
                ':!scripts/pb626-fat-contiguous.c' \
                ':!scripts/install-pb626-emmc.sh' \
                ':!scripts/Install-PB626.ps1' \
                ':!boot/pb626-native-entry.S' \
                ':!boot/pb626-native-setup' \
                ':!boot/pb626-native-desktop' \
                ':!boot/pb626-native-console' \
                ':!boot/pb626-native.inittab' \
                ':!README.md' ':!docs/**' \
                ':!.github/workflows/ci.yml' \
                ':!.github/workflows/megi-fel.yml'; then
              continue
            fi
            # Do not reuse across a changed upstream build recipe. Compare
            # the actual recipe from the first Alpine job up to the native
            # packaging step, ignoring only the new job dependency guards.
            git show "$sha:.github/workflows/megi-fel.yml" > /tmp/source-workflow.yml
            if ! python3 - /tmp/source-workflow.yml .github/workflows/megi-fel.yml <<'PY'
          import sys, yaml
          def recipe(path):
              with open(path) as f:
                  jobs=yaml.safe_load(f)['jobs']
              result={}
              for key in ('alpine-base','kernel','bundle','desktop-native'):
                  job=jobs[key].copy()
                  for attr in ('name','needs','if'):
                      job.pop(attr,None)
                  if key=='desktop-native':
                      job['steps']=[s for s in job['steps'] if s.get('name') not in (
                          'Build and verify the complete native eMMC installer',
                          'Package optional disk applications') and s.get('with',{}).get('name') not in (
                          'pb626-native-emmc-installer','pb626-desktop-extras')]
                  result[key]=job
              return result
          sys.exit(0 if recipe(sys.argv[1])==recipe(sys.argv[2]) else 1)
          PY
            then
              continue
            fi
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100")
            if jq -e '([.artifacts[] | select(.expired==false and .name=="pb626-mainline-7.2-ram-bundle")] | length)==1 and ([.artifacts[] | select(.expired==false and .name=="pb626-megi-eink-desktop")] | length)==1' <<<"$artifacts" >/dev/null; then
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              echo "Reusing immutable RAM/Desktop artifacts from run $id ($sha)"
              exit 0
            fi
          done <<< "$runs"
          echo 'No compatible unexpired artifact pair; normal build required.'

  alpine-base:
    needs: [plan]
    if: needs.plan.outputs.reuse_run == ''
    name: Alpine ARMv7 base (independent cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore Alpine base filesystem cache
        id: cache
        uses: actions/cache@v4
        with:
          path: alpine-cache/alpine-rootfs.tar.gz
          key: pb626-alpine-armv7-v3.24.4-${{ runner.os }}-${{ hashFiles('scripts/build-alpine-rootfs.sh') }}
      - name: Install emulator for Alpine setup on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Assemble Alpine base on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-alpine-rootfs.sh
      - name: Verify Alpine archive
        run: |
          set -euo pipefail
          test -s alpine-cache/alpine-rootfs.tar.gz
          gzip -t alpine-cache/alpine-rootfs.tar.gz
          tar -tzf alpine-cache/alpine-rootfs.tar.gz | grep -F './sbin/apk' >/dev/null
          echo "Alpine cache hit: ${{ steps.cache.outputs.cache-hit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-alpine-base-stage
          path: alpine-cache/alpine-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1

  kernel:
    needs: [plan]
    if: needs.plan.outputs.reuse_run == ''
    name: Megi kernel + DTBs (prebuilt cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and DT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc-arm-linux-gnueabihf libc6-dev-armhf-cross make bc bison flex \
            libssl-dev libelf-dev device-tree-compiler libncurses-dev lz4 kmod
      - name: Validate ARM static-link toolchain before downloading the kernel
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' |
            arm-linux-gnueabihf-gcc -x c -static - -o /tmp/pb626-toolchain-smoke
          test -s /tmp/pb626-toolchain-smoke
          file /tmp/pb626-toolchain-smoke | grep -q 'ARM'
      - name: Fingerprint the complete kernel build toolchain
        id: compiler
        run: |
          set -euo pipefail
          # Kconfig records GCC, assembler, linker, and Rust feature versions.
          # A GCC-only key can restore a non-reproducible .config.
          fingerprint=$(
            {
              arm-linux-gnueabihf-gcc --version | sed -n '1p'
              arm-linux-gnueabihf-as --version | sed -n '1p'
              arm-linux-gnueabihf-ld --version | sed -n '1p'
              gcc --version | sed -n '1p'
              rustc --version 2>/dev/null || echo 'rustc unavailable'
              dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
            } | sha256sum | cut -c1-20
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Toolchain fingerprint: $fingerprint"
      - name: Restore prebuilt kernel and modules cache
        id: cache
        uses: actions/cache@v4
        with:
          path: kernel-cache
          key: pb626-megi-kernel-v4-facc87117511221-${{ runner.os }}-${{ runner.arch }}-tool${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/configure-megi-kernel.sh', 'patches/rtl8xxxu-reset-linktype.patch', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch') }}
      - name: Fetch pinned Megi 7.2 source and verify A13 drivers
        run: |
          set -euo pipefail
          git clone --depth 1 --branch orange-pi-7.2-20260903-2131 \
            https://github.com/Arnavion/linux.git linux
          test "$(git -C linux rev-parse HEAD)" = facc87117511221bb61410e3f92ad8579697f736
          grep -q '^VERSION = 7$' linux/Makefile
          grep -q '^PATCHLEVEL = 2$' linux/Makefile
          f=linux/drivers/clocksource/timer-sun4i.c
          grep -q 'sun4i_clkevt_wait_reload' "$f"
          grep -q 'TIMER_SYNC_TICKS + 1' "$f"
          test -f linux/drivers/video/fbdev/sun5i-eink.c
          test -f linux/drivers/regulator/tps65185.c
          test -f linux/arch/arm/configs/pocketbook_touch_lux_3_defconfig
          test -f linux/arch/arm/boot/dts/allwinner/sun5i-a13-pocketbook-touch-lux-3.dts
          git -C linux apply --check "$GITHUB_WORKSPACE/patches/rtl8xxxu-reset-linktype.patch"
          git -C linux apply "$GITHUB_WORKSPACE/patches/rtl8xxxu-reset-linktype.patch"
          git -C linux apply "$GITHUB_WORKSPACE/patches/pwm-backlight-disconnect-when-off.patch"
          git -C linux apply "$GITHUB_WORKSPACE/patches/ektf2227-pocketbook-touch.patch"
          grep -A 13 '^static void rtl8xxxu_remove_interface' linux/drivers/net/wireless/realtek/rtl8xxxu/core.c | grep -Fq 'NL80211_IFTYPE_UNSPECIFIED'
      - name: Verify cached Kconfig reproducibility
        id: kconfig
        run: |
          set -euo pipefail
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo 'No kernel cache: compile using the pinned source and current tools.'
            exit 0
          fi
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo '::warning::Cached kernel .config differs from current Kconfig; rebuilding kernel and modules together.'
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile zImage and all modules on cache miss or config drift
        if: steps.cache.outputs.cache-hit != 'true' || steps.kconfig.outputs.rebuild == 'true'
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          # A stale cache must never be mixed with newly generated DTBs.
          if [ "${{ steps.kconfig.outputs.rebuild }}" = true ]; then
            rm -rf kernel-cache
          fi
          bash scripts/configure-megi-kernel.sh
          make -C linux -j"$(nproc)" KCFLAGS=-Wno-error zImage modules
          mkdir -p kernel-cache module-root
          cp linux/arch/arm/boot/zImage kernel-cache/pb626-megi-zImage
          stat -c %s linux/arch/arm/boot/Image > kernel-cache/IMAGE_SIZE
          cp linux/.config kernel-cache/pb626-megi.config
          release=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' linux/include/generated/utsrelease.h)
          test -n "$release"
          printf '%s\n' "$release" > kernel-cache/KERNELRELEASE
          make -C linux modules_install KERNELRELEASE="$release" INSTALL_MOD_PATH="$PWD/module-root" DEPMOD=true
          depmod -b module-root "$release"
          tar -C module-root -czf kernel-cache/kernel-modules.tar.gz lib/modules
          printf '%s\n' 'Tag: orange-pi-7.2-20260903-2131' \
            'Git commit: facc87117511221bb61410e3f92ad8579697f736' \
            'Maintainer: Ondrej Jirman (megi); mirror: Arnavion/linux' > kernel-cache/KERNEL-SOURCE.txt
          echo 'Experimental local patch: patches/rtl8xxxu-reset-linktype.patch' >> kernel-cache/KERNEL-SOURCE.txt
          echo 'Local patch: patches/pwm-backlight-disconnect-when-off.patch' >> kernel-cache/KERNEL-SOURCE.txt
          echo 'Local patch: patches/ektf2227-pocketbook-touch.patch' >> kernel-cache/KERNEL-SOURCE.txt
      - name: Check cached or newly compiled zImage, modules and USB contract
        run: |
          set -euo pipefail
          test -s kernel-cache/pb626-megi-zImage
          test -s kernel-cache/pb626-megi.config
          test -s kernel-cache/IMAGE_SIZE
          grep -qx 'CONFIG_AUTO_ZRELADDR=y' kernel-cache/pb626-megi.config
          test -s kernel-cache/kernel-modules.tar.gz
          test -s kernel-cache/KERNELRELEASE
          test -s kernel-cache/KERNEL-SOURCE.txt
          gzip -t kernel-cache/kernel-modules.tar.gz
          grep -qx 'CONFIG_USB_MUSB_HDRC=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_MUSB_SUNXI=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_MUSB_DUAL_ROLE=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_PHY_SUN4I_USB=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_EXTCON=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_CONFIGFS_ACM=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_CMA_SIZE_MBYTES=32' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_REGULATOR_TPS65185=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_DRM_LIMA=m' kernel-cache/pb626-megi.config
          echo "Prebuilt kernel cache hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Rebuilt for Kconfig drift: ${{ steps.kconfig.outputs.rebuild }}"
      - name: Build current Device Trees
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo "::error::DTB Kconfig differs from the kernel that supplied zImage/modules"
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            exit 1
          fi
          mkdir -p dtb-stage
          bash scripts/build-megi-variants.sh linux dtb-stage "$PWD"
      - name: Assemble portable kernel-stage artifact
        run: |
          set -euo pipefail
          mkdir -p kernel-stage
          cp kernel-cache/* kernel-stage/
          cp dtb-stage/pb626-*.dtb kernel-stage/
          install -D -m 0644 linux/include/uapi/linux/sun5i-eink.h kernel-stage/uapi/linux/sun5i-eink.h
          test "$(find kernel-stage -maxdepth 1 -name 'pb626-*.dtb' | wc -l)" -eq 9
      - name: Test and compile the E Ink utility with the existing ARM toolchain
        run: |
          set -euo pipefail
          gcc -O2 -Wall -Wextra -Werror -I kernel-stage/uapi \
            display/test-pb626-epd.c -o test-pb626-epd
          ./test-pb626-epd
          arm-linux-gnueabihf-gcc -O3 -Wall -Wextra -Werror -static -I kernel-stage/uapi \
            display/pb626-epd.c -o kernel-stage/pb626-epd
          test -s kernel-stage/pb626-epd
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage/
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: Final RAM bundle (no kernel rebuild)
    runs-on: ubuntu-24.04
    needs: [plan, kernel, alpine-base]
    if: needs.plan.outputs.reuse_run == ''
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - uses: actions/download-artifact@v4
        with:
          name: pb626-alpine-base-stage
          path: alpine-base
      - name: Install packaging tools and the display utility cross-compiler
        timeout-minutes: 9
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "APT setup attempt $attempt/2"
            if sudo timeout 180s apt-get -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update &&
               sudo timeout 240s apt-get -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
                install -y --no-install-recommends \
                  cpio device-tree-compiler e2fsprogs kmod zstd; then
              exit 0
            fi
            echo "APT setup attempt $attempt failed or timed out"
            sleep 5
          done
          exit 1
      - name: Use the verified ARM E Ink utility from the kernel stage
        run: |
          set -euo pipefail
          test -s kernel-stage/pb626-epd
          cp kernel-stage/pb626-epd pb626-epd
          chmod +x pb626-epd
      - name: Assemble full Alpine RAM image from independent stages
        run: bash scripts/assemble-megi-ram.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

  desktop-native:
    name: Full Desktop (independent reusable artifact)
    runs-on: ubuntu-24.04
    needs: [plan, bundle]
    if: needs.plan.outputs.reuse_run == ''
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          path: fel-bundle
      - name: Restore Desktop userspace cache
        id: desktop-cache
        uses: actions/cache@v4
        with:
          path: desktop-cache
          key: pb626-native-desktop-v1-${{ runner.os }}-${{ hashFiles('scripts/build-megi-desktop.sh', 'scripts/build-alpine-rootfs.sh', 'scripts/assemble-megi-ram.sh', 'scripts/configure-megi-kernel.sh', 'scripts/probe-device.sh', 'scripts/inspect-live.sh', 'scripts/pb626-network.sh', 'boot/**', 'board/megi/**', 'patches/**', 'display/**') }}
      - name: Install ARM and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio device-tree-compiler ncurses-bin qemu-user-static \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Build matching Alpine Xorg and Matchbox
        run: |
          set -euo pipefail
          if [ -s desktop-cache/pb626-desktop-root.cpio.gz ]; then
            bash scripts/build-megi-desktop.sh fel-bundle desktop-cache
          else
            bash scripts/build-megi-desktop.sh fel-bundle
          fi
      - name: Save reusable RAM Desktop before native conversion
        if: steps.desktop-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p desktop-cache
          cp dist/pb626-desktop-root.cpio.gz desktop-cache/
          (cd desktop-cache && sha256sum pb626-desktop-root.cpio.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-megi-eink-desktop
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package optional disk applications
        run: tar -czf pb626-desktop-extras.tar.gz -C display/extras .
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-desktop-extras
          path: pb626-desktop-extras.tar.gz
          if-no-files-found: error

  native-installer:
    name: Package native eMMC installer (no kernel or Desktop compilation)
    runs-on: ubuntu-24.04
    needs: [plan, bundle, desktop-native]
    if: always() && !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.reuse_run != '' || (needs.bundle.result == 'success' && needs.desktop-native.result == 'success'))
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
          path: fel-bundle
      - uses: actions/download-artifact@v4
        with:
          name: pb626-megi-eink-desktop
          run-id: ${{ needs.plan.outputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
          path: desktop-bundle
      - name: Install only packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio device-tree-compiler qemu-user-static binutils-arm-linux-gnueabihf \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Verify and unpack the already compiled Desktop
        run: |
          set -euo pipefail
          (cd fel-bundle && sha256sum -c SHA256SUMS)
          (cd desktop-bundle && sha256sum -c SHA256SUMS)
          cmp fel-bundle/pb626-megi-zImage desktop-bundle/pb626-megi-zImage
          cmp fel-bundle/KERNELRELEASE desktop-bundle/KERNELRELEASE
          cmp fel-bundle/pb626-elan-display.dtb desktop-bundle/pb626-elan-display.dtb
          cmp fel-bundle/pb626-megi-initramfs.cpio.gz desktop-bundle/pb626-megi-initramfs.cpio.gz
          mkdir desktop-root
          gzip -cd desktop-bundle/pb626-desktop-root.cpio.gz |
            (cd desktop-root && sudo cpio -id --quiet --no-absolute-filenames)
      - name: Build and verify the complete native eMMC installer
        run: bash scripts/build-native-install.sh fel-bundle desktop-root native-dist
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-native-emmc-installer
          path: native-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package optional disk applications on reuse
        if: needs.plan.outputs.reuse_run != ''
        run: tar -czf pb626-desktop-extras.tar.gz -C display/extras .
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.reuse_run != ''
        with:
          name: pb626-desktop-extras
          path: pb626-desktop-extras.tar.gz
          if-no-files-found: error
