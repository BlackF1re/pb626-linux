name: Firmware

# Single full firmware pipeline. Main builds automatically; feature branches
# use the explicit qualification request or Run workflow. All stage artifacts
# are from this run, and the final gate requires every selected job.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'BT0-uncaged/**'
      - 'board/**'
      - 'boot/**'
      - 'display/**'
      - 'diagnostics/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/FLASH-KIT.md'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: megi-fel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  host-checks:
    name: CI
    uses: ./.github/workflows/ci.yml
  restore-checks:
    name: Recovery tests
    uses: ./.github/workflows/restore.yml
  kernel:
    name: Linux kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and DT tools
        run: |
          # Ignore only the optional Microsoft feed; firmware build dependencies come from Ubuntu.
          mapfile -t blocked_sources < <(grep -RIl -- 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if (("${#blocked_sources[@]}" > 0)); then
            sudo rm -f "${blocked_sources[@]}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc-arm-linux-gnueabihf libc6-dev-armhf-cross make bc bison flex \
            libssl-dev libelf-dev device-tree-compiler libncurses-dev lz4 kmod
      - name: Check ARM static linking
        run: |
          set -euo pipefail
          printf 'int main(void) { return 0; }\n' |
            arm-linux-gnueabihf-gcc -x c -static - -o /tmp/pb626-toolchain-smoke
          test -s /tmp/pb626-toolchain-smoke
          file /tmp/pb626-toolchain-smoke | grep -q 'ARM'
      - name: Fingerprint toolchain
        id: compiler
        run: |
          set -euo pipefail
          # Kconfig records GCC, assembler, linker, and Rust feature versions.
          # A GCC-only key can restore a non-reproducible .config.
          fingerprint=$(
            {
              arm-linux-gnueabihf-gcc --version | sed -n '1p'
              arm-linux-gnueabihf-as --version | sed -n '1p'
              arm-linux-gnueabihf-ld --version | sed -n '1p'
              gcc --version | sed -n '1p'
              rustc --version 2>/dev/null || echo 'rustc unavailable'
              dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
            } | sha256sum | cut -c1-20
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Toolchain fingerprint: $fingerprint"
      - name: Restore full kernel cache
        id: complete
        uses: actions/cache@v4
        with:
          path: kernel-complete
          key: pb626-megi-complete-v1-facc87117511221-${{ runner.os }}-${{ runner.arch }}-tool${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'scripts/configure-megi-kernel.sh', 'board/**', 'scripts/build-megi-variants.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch', 'patches/suspend/**') }}
      - name: Restore kernel cache
        if: steps.complete.outputs.cache-hit != 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: kernel-cache
          key: pb626-megi-kernel-v3-facc87117511221-${{ runner.os }}-${{ runner.arch }}-tool${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'scripts/configure-megi-kernel.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch', 'patches/suspend/**') }}
      - name: Restore pinned source cache
        if: steps.complete.outputs.cache-hit != 'true'
        id: linux-source
        uses: actions/cache/restore@v4
        with:
          path: linux/.git
          key: pb626-linux-git-v1-facc87117511221bb61410e3f92ad8579697f736-${{ runner.os }}
      - name: Fetch and verify kernel
        if: steps.complete.outputs.cache-hit != 'true'
        run: bash scripts/build-megi-kernel.sh prepare
      - name: Save pinned source cache
        if: steps.complete.outputs.cache-hit != 'true' && steps.linux-source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: linux/.git
          key: ${{ steps.linux-source.outputs.cache-primary-key }}
      - name: Check Kconfig
        if: steps.complete.outputs.cache-hit != 'true'
        id: kconfig
        run: |
          set -euo pipefail
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            echo 'No kernel cache: compile using the pinned source and current tools.'
            exit 0
          fi
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo '::warning::Cached kernel .config differs from current Kconfig; rebuilding kernel and modules together.'
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build kernel and modules
        if: steps.complete.outputs.cache-hit != 'true' && (steps.cache.outputs.cache-hit != 'true' || steps.kconfig.outputs.rebuild == 'true')
        run: bash scripts/build-megi-kernel.sh compile "${{ steps.kconfig.outputs.rebuild }}"
      - name: Verify kernel and USB
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          test -s kernel-cache/pb626-megi-zImage
          test -s kernel-cache/pb626-megi.config
          test -s kernel-cache/kernel-modules.tar.gz
          test -s kernel-cache/KERNELRELEASE
          test -s kernel-cache/KERNEL-SOURCE.txt
          gzip -t kernel-cache/kernel-modules.tar.gz
          grep -qx 'CONFIG_USB_MUSB_HDRC=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_MUSB_SUNXI=y' kernel-cache/pb626-megi.config
          bash scripts/configure-megi-kernel.sh --check kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_PHY_SUN4I_USB=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_EXTCON=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_USB_CONFIGFS_ACM=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_CMA_SIZE_MBYTES=32' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_REGULATOR_TPS65185=y' kernel-cache/pb626-megi.config
          grep -qx 'CONFIG_DRM_LIMA=m' kernel-cache/pb626-megi.config
          for key in AUTO_ZRELADDR FB_SUN5I_EINK VIDEOBUF2_CORE VIDEOBUF2_V4L2 VIDEOBUF2_MEMOPS VIDEOBUF2_DMA_CONTIG; do
            grep -qx "CONFIG_$key=y" kernel-cache/pb626-megi.config
          done
          grep -Fq -- '-pb626' kernel-cache/KERNELRELEASE
          tar -xOzf kernel-cache/kernel-modules.tar.gz "lib/modules/$(cat kernel-cache/KERNELRELEASE)/modules.builtin" > /tmp/pb626-modules.builtin
          grep -Fxq 'kernel/drivers/video/fbdev/sun5i-eink.ko' /tmp/pb626-modules.builtin
          echo "Prebuilt kernel cache hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Rebuilt for Kconfig drift: ${{ steps.kconfig.outputs.rebuild }}"
      - name: Restore validated DTBs
        if: steps.complete.outputs.cache-hit != 'true'
        id: dtbs
        uses: actions/cache@v4
        with:
          path: dtb-stage
          key: pb626-dtbs-v1-facc87117511221-${{ runner.os }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('scripts/build-megi-kernel.sh', 'kernel-cache/pb626-megi.config', 'board/**', 'scripts/build-megi-variants.sh', 'patches/pwm-backlight-disconnect-when-off.patch', 'patches/ektf2227-pocketbook-touch.patch', 'patches/a13-mbus-dma-devlink.patch', 'patches/sun5i-eink-runtime-pm.patch', 'patches/sun4i-lradc-system-pm.patch', 'patches/axp209-boot-source.patch', 'patches/suspend/**') }}
      - name: Build DTBs
        if: steps.complete.outputs.cache-hit != 'true' && steps.dtbs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          cp kernel-cache/pb626-megi.config linux/.config
          make -C linux olddefconfig
          if ! cmp -s linux/.config kernel-cache/pb626-megi.config; then
            echo "::error::DTB Kconfig differs from the kernel that supplied zImage/modules"
            diff -u kernel-cache/pb626-megi.config linux/.config || true
            exit 1
          fi
          mkdir -p dtb-stage
          bash scripts/build-megi-variants.sh linux dtb-stage "$PWD"
          (cd dtb-stage && sha256sum pb626-*.dtb > SHA256SUMS)
      - name: Verify DTB cache
        if: steps.complete.outputs.cache-hit != 'true'
        run: (cd dtb-stage && sha256sum -c SHA256SUMS)
      - name: Stage kernel
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p kernel-stage
          cp kernel-cache/* kernel-stage/
          cp dtb-stage/pb626-*.dtb kernel-stage/
          install -D -m 0644 linux/include/uapi/linux/sun5i-eink.h kernel-stage/uapi/linux/sun5i-eink.h
          expected=$(printf '%s\n' pb626-{elan-display,elan-emmc-backup,elan-emmc-native}.dtb | LC_ALL=C sort)
          actual=$(find kernel-stage -maxdepth 1 -type f -name 'pb626-*.dtb' -printf '%f\n' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo '::error::Unexpected DTB set'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
      - name: Save kernel stage
        if: steps.complete.outputs.cache-hit != 'true'
        run: |
          cp -a kernel-stage kernel-complete
          (cd kernel-complete && find . -type f ! -path ./SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Verify kernel cache
        if: steps.complete.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          (cd kernel-complete && sha256sum -c SHA256SUMS)
          bash scripts/configure-megi-kernel.sh --check kernel-complete/pb626-megi.config
          cp -a kernel-complete kernel-stage
          rm kernel-stage/SHA256SUMS
      - name: Report kernel config
        run: |
          set -euo pipefail
          cfg=kernel-stage/pb626-megi.config
          bash scripts/configure-megi-kernel.sh --check "$cfg"
          for key in SMP HOTPLUG_CPU NR_CPUS ARM_PSCI PREEMPT PREEMPT_DYNAMIC PREEMPT_NONE PREEMPT_VOLUNTARY THUMB2_KERNEL ARM_UNWIND CC_OPTIMIZE_FOR_SIZE BASE_SMALL HAVE_LD_DEAD_CODE_DATA_ELIMINATION LD_DEAD_CODE_DATA_ELIMINATION KALLSYMS KALLSYMS_ALL LOG_BUF_SHIFT DEBUG_INFO PERF_EVENTS TASKSTATS TASK_IO_ACCOUNTING CPU_FREQ_STAT CFG80211_DEBUGFS MAC80211_DEBUGFS CFG80211_WEXT OF_OVERLAY BOOT_CONFIG PM_WAKELOCKS THERMAL_STATISTICS CMA_DEBUGFS MODVERSIONS SERIAL_8250_NR_UARTS SERIAL_8250_RUNTIME_UARTS CRYPTO_AES_TI CRYPTO_AES_ARM_CE CRYPTO_GHASH_ARM_CE CRYPTO_SHA1_ARM_CE CRYPTO_SHA1_ARM_NEON CRYPTO_AES_ARM_BS CRYPTO_LZO CRYPTO_ZSTD CRYPTO_DEFLATE CRYPTO_LZ4 ZRAM_BACKEND_LZ4 LRU_GEN HZ; do
            grep -E "^(CONFIG_$key=|# CONFIG_$key is not set$)" "$cfg" || echo "CONFIG_$key: absent"
          done
          stat -c '%s bytes %n' kernel-stage/pb626-megi-zImage kernel-stage/kernel-modules.tar.gz
          echo "Installed loadable modules:"
          tar -tzf kernel-stage/kernel-modules.tar.gz | awk '/[.]ko([.](gz|xz|zst))?$/ {n++} END {print n+0}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BT0-uncaged/emulator/requirements.txt
      - run: python -m pip install -r BT0-uncaged/emulator/requirements.txt
      - name: Test suspend SRAM
        run: |
          set -euo pipefail
          test -s kernel-stage/sleep-sun5i.o
          arm-linux-gnueabihf-objcopy -O binary -j .text kernel-stage/sleep-sun5i.o /tmp/suspend-sram.bin
          python3 tests/test-suspend-sram.py kernel-stage/sleep-sun5i.o /tmp/suspend-sram.bin
      - name: Stamp kernel stage
        run: |
          git rev-parse HEAD > kernel-stage/BUILD-COMMIT
          (cd kernel-stage && find . -type f ! -path ./SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  debian-base:
    name: Debian base
    outputs:
      manifest: ${{ steps.base-manifest.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Weekly cache epoch
        id: epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: base
        with:
          path: debian-base
          key: pb626-debian-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.week }}-${{ hashFiles('scripts/build-debian-base.sh') }}
      - name: Install bootstrap tools
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          # Ignore only the optional Microsoft feed; firmware build dependencies come from Ubuntu.
          mapfile -t blocked_sources < <(grep -RIl -- 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if (("${#blocked_sources[@]}" > 0)); then
            sudo rm -f "${blocked_sources[@]}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring qemu-user-static binfmt-support arch-test
          sudo update-binfmts --enable qemu-arm
          arch-test armhf
      - name: Build Debian base
        if: steps.base.outputs.cache-hit != 'true'
        run: bash scripts/build-debian-base.sh debian-base
      - name: Check base integrity
        id: base-manifest
        run: |
          (cd debian-base && sha256sum -c SHA256SUMS)
          echo "sha=$(sha256sum debian-base/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-debian-base-stage
          path: debian-base/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  bootloader:
    name: BT0
    uses: ./.github/workflows/source-bootloader.yml
    secrets: inherit

  fel-host:
    name: FEL tools
    uses: ./.github/workflows/fel-host.yml

  diagnostics:
    name: Diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler
        run: |
          # Ignore only the optional Microsoft feed; firmware build dependencies come from Ubuntu.
          mapfile -t blocked_sources < <(grep -RIl -- 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if (("${#blocked_sources[@]}" > 0)); then
            sudo rm -f "${blocked_sources[@]}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
      - run: |
          sh -n diagnostics/pb626-diagnostics
          sh diagnostics/pb626-diagnostics --self-test
          mkdir diagnostic-dist
          install -m 755 diagnostics/pb626-diagnostics diagnostic-dist/pb626-diagnostics
          arm-linux-gnueabihf-gcc -O2 -Wall -Wextra -Werror -static -s diagnostics/pb626-diag-clock.c -o diagnostic-dist/pb626-diag-clock
          cp diagnostics/README.md diagnostic-dist/README.md
          git rev-parse HEAD > diagnostic-dist/BUILD-COMMIT
          (cd diagnostic-dist && sha256sum pb626-diagnostics pb626-diag-clock README.md BUILD-COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-diagnostics
          path: diagnostic-dist/
          if-no-files-found: error
          retention-days: 14

  debian-native:
    name: Debian rootfs
    needs: [kernel, debian-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - name: Verify kernel stage
        run: |
          test "$(cat kernel-stage/BUILD-COMMIT)" = "$(git rev-parse HEAD)"
          (cd kernel-stage && sha256sum -c SHA256SUMS)
      - name: Verify base fingerprint
        env:
          BASE_SHA: ${{ needs.debian-base.outputs.manifest }}
        run: test "${#BASE_SHA}" = 64
      - name: Restore native cache
        id: native-content
        uses: actions/cache@v4
        with:
          path: debian-dist
          key: pb626-native-content-v2-${{ runner.os }}-${{ runner.arch }}-${{ needs.debian-base.outputs.manifest }}-${{ hashFiles('kernel-stage/pb626-megi-zImage', 'kernel-stage/pb626-elan-emmc-native.dtb', 'kernel-stage/kernel-modules.tar.gz', 'kernel-stage/pb626-megi.config', 'kernel-stage/KERNELRELEASE', 'kernel-stage/KERNEL-SOURCE.txt', 'kernel-stage/uapi/linux/sun5i-eink.h', 'scripts/build-debian-rootfs.sh', 'scripts/build-matchbox-themes.py', 'scripts/build-direct-image.sh', 'scripts/build-rootfs-bmap.py', 'BT0-uncaged/early-menu.S', 'BT0-uncaged/test_hook.py', 'scripts/compile-debian-native.sh', 'scripts/configure-megi-kernel.sh', 'scripts/profile-memory.sh', 'scripts/inspect-live.sh', 'scripts/probe-device.sh', 'boot/debian/**', 'boot/native/**', 'boot/pb626-native-desktop', 'display/**', 'diagnostics/pb626-diagnostics', 'diagnostics/pb626-diag-clock.c', 'BT0-uncaged/pack-kernel.py', 'BT0-uncaged/kernel-entry.S', 'tests/check-control-center.tcl', 'LICENSE') }}
      - name: Download Debian base
        if: steps.native-content.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pb626-debian-base-stage
          path: debian-base
      - name: Verify Debian base
        if: steps.native-content.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ needs.debian-base.outputs.manifest }}
        run: |
          test "$(sha256sum debian-base/SHA256SUMS | cut -d' ' -f1)" = "$BASE_SHA"
          (cd debian-base && sha256sum -c SHA256SUMS)
      - name: Install build tools
        if: steps.native-content.outputs.cache-hit != 'true'
        run: |
          # Ignore only the optional Microsoft feed; firmware build dependencies come from Ubuntu.
          mapfile -t blocked_sources < <(grep -RIl -- 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if (("${#blocked_sources[@]}" > 0)); then
            sudo rm -f "${blocked_sources[@]}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring \
            qemu-user-static binfmt-support arch-test device-tree-compiler kmod ncurses-bin git clang lld llvm e2fsprogs
          command -v clang ld.lld
          sudo update-binfmts --enable qemu-arm
          test -r /proc/sys/fs/binfmt_misc/qemu-arm
          arch-test armhf
      - uses: actions/cache@v4
        if: steps.native-content.outputs.cache-hit != 'true'
        id: native-binaries
        with:
          path: debian-compiled-cache
          key: pb626-debian-compiled-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('debian-base/SHA256SUMS', 'kernel-stage/uapi/linux/sun5i-eink.h', 'scripts/compile-debian-native.sh', 'display/pb626-epd.c', 'display/pb626-epd.h', 'display/pb626-x11-epd.c', 'display/pb626-sleep.h', 'display/pb626-ddx-fb.h', 'display/test-pb626-epd.c', 'display/test-pb626-x11-epd.c', 'display/test-matchbox-clients.sh', 'display/pb626-taskbar.c', 'display/test-pb626-taskbar.c', 'display/keyboard-us.xml', 'display/matchbox-keyboard-eink.patch', 'display/matchbox-panel-power-supply.patch', 'display/xorg-dummy-pb626-shared.patch', 'boot/debian/pb626-charge.c') }}
      - name: Build Debian firmware
        if: steps.native-content.outputs.cache-hit != 'true'
        run: bash scripts/build-debian-rootfs.sh kernel-stage debian-dist debian-base debian-compiled-cache
      - name: Verify and stamp firmware
        run: |
          set -euo pipefail
          (cd debian-dist && sha256sum -c SHA256SUMS)
          test -s debian-dist/pb626-rootfs.ext4.gz
          test -s debian-dist/pb626-rootfs.bmap.json
          test -s debian-dist/pb626-bt0-menu.raw
          test -s debian-dist/CONTENT-BUILD-COMMIT
          git rev-parse HEAD > debian-dist/BUILD-COMMIT
          (cd debian-dist && sha256sum pb626-* KERNELRELEASE KERNEL-SOURCE.txt BUILD-COMMIT CONTENT-BUILD-COMMIT raw-linux.img DEBIAN-PACKAGES.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-native-debian13-armhf
          path: debian-dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  recovery:
    name: RAM recovery
    needs: [kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-kernel-stage
          path: kernel-stage
      - name: Verify kernel stage
        run: |
          test "$(cat kernel-stage/BUILD-COMMIT)" = "$(git rev-parse HEAD)"
          (cd kernel-stage && sha256sum -c SHA256SUMS)
      - name: Install recovery tools
        run: |
          # Ignore only the optional Microsoft feed; firmware build dependencies come from Ubuntu.
          mapfile -t blocked_sources < <(grep -RIl -- 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if (("${#blocked_sources[@]}" > 0)); then
            sudo rm -f "${blocked_sources[@]}"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user cpio device-tree-compiler
      - name: Fingerprint recovery
        id: recovery-tools
        run: |
          fingerprint=$(dpkg-query -W -f='${Version}\n' gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross | sha256sum | cut -c1-20)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: recovery-payload
        with:
          path: recovery-payload
          key: pb626-recovery-payload-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.recovery-tools.outputs.week }}-${{ steps.recovery-tools.outputs.fingerprint }}-${{ hashFiles('scripts/build-debian-recovery.sh', 'scripts/restore/pb626-restore-scan.c') }}
      - name: Build recovery
        run: bash scripts/build-debian-recovery.sh kernel-stage flash-kit recovery-payload
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-debian-recovery
          path: flash-kit/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-powershell51:
    name: PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }
          .\tests\test-powershell51.ps1

  windows-host:
    name: Windows tools
    uses: ./.github/workflows/windows-host.yml

  windows-kit:
    name: Windows installer
    needs: [debian-native, recovery, fel-host, bootloader, windows-host, host-checks, restore-checks, windows-powershell51]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-native-debian13-armhf
          path: native-stage
      - uses: actions/download-artifact@v4
        with:
          name: pb626-debian-recovery
          path: recovery-stage
      - uses: actions/download-artifact@v4
        with:
          name: pb626-windows-host-tools
          path: windows-host
      - uses: actions/download-artifact@v4
        with:
          name: pb626-fel-host-tools
          path: fel-host
      - uses: actions/download-artifact@v4
        with:
          name: pb626-bootloader-stage
          path: bootloader-stage
      - uses: actions/download-artifact@v4
        with:
          name: pb626-spl-emulation-report
          path: qualification
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio device-tree-compiler
          bash scripts/windows/assemble-kit.sh windows-kit
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-windows-installer
          path: windows-kit/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  windows-kit-check:
    name: Installer validation
    needs: [windows-kit]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pb626-windows-installer
          path: windows-kit
      - name: Test Windows kit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Wrong PowerShell version' }
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\windows-kit\PB626.ps1).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) { throw ($errors -join '; ') }
          & .\windows-kit\PB626.ps1 -Action Validate
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows package validation failed' }
          & .\windows-kit\host\python\python.exe .\tests\test-windows-flasher.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows transport model failed' }

  qualification:
    name: Qualification
    needs: [host-checks, restore-checks, windows-powershell51, kernel, debian-base, bootloader, fel-host, diagnostics, debian-native, recovery, windows-host, windows-kit, windows-kit-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          jobs = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items()}
          bad = {k: v for k, v in jobs.items() if v != "success"}
          report = {"commit": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
                    "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "jobs": jobs,
                    "result": "FAILED" if bad else "PASS",
                    "scope": "Compilation, packaging and host/model tests only; no hardware qualification"}
          pathlib.Path("qualification.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if bad:
              raise SystemExit("Required build or check did not pass: " + str(bad))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pb626-full-build-report
          path: qualification.json
          if-no-files-found: error
