name: Megi mainline Linux 7.2 RAM Linux

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/megi-fel.yml'
      - 'board/megi/**'
      - 'boot/init-megi'
      - 'boot/pb626-init-megi'
      - 'scripts/build-megi-variants.sh'
      - 'patches/megi-timer-reload-2026.patch'
      - 'patches/sun4i-min-delta-2026.patch'
      - 'scripts/probe-device.sh'
      - 'scripts/inspect-live.sh'
      - 'boot/init-megi'
  pull_request:
    paths:
      - '.github/workflows/megi-fel.yml'
      - 'board/megi/**'
      - 'boot/init-megi'
      - 'boot/pb626-init-megi'
      - 'patches/**'
      - 'scripts/build-megi-variants.sh'
      - 'scripts/probe-device.sh'
      - 'scripts/inspect-live.sh'
  workflow_dispatch:

concurrency:
  group: megi-fel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-and-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git gcc-arm-linux-gnueabihf make bc bison flex libssl-dev libelf-dev \
            device-tree-compiler libncurses-dev lz4 cpio kmod \
            qemu-user-static fdisk e2fsprogs dosfstools mtools
      - name: Fetch pinned Megi mainline Linux 7.2 kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch orange-pi-7.2-20260903-2131 \
            https://github.com/Arnavion/linux.git linux
          test "$(git -C linux rev-parse HEAD)" = facc87117511221bb61410e3f92ad8579697f736
          grep -q '^VERSION = 7$' linux/Makefile
          grep -q '^PATCHLEVEL = 2$' linux/Makefile
          printf '%s\n' 'Tag: orange-pi-7.2-20260903-2131' \
            'Git commit: facc87117511221bb61410e3f92ad8579697f736' \
            'Maintainer: Ondrej Jirman (megi); mirror: Arnavion/linux' > KERNEL-SOURCE.txt
      - name: Verify 2026 clocksource fixes and PocketBook drivers included
        shell: bash
        run: |
          set -euo pipefail
          f=linux/drivers/clocksource/timer-sun4i.c
          grep -q 'sun4i_clkevt_wait_reload' "$f"
          grep -q 'TIMER_SYNC_TICKS + 1' "$f"
          test -f linux/drivers/video/fbdev/sun5i-eink.c
          test -f linux/drivers/regulator/tp65185x.c
          test -f linux/arch/arm/configs/pocketbook_touch_lux_3_defconfig
          test -f linux/arch/arm/boot/dts/allwinner/sun5i-a13-pocketbook-touch-lux-3.dts
      - name: Configure full PB626 support without external boot-time modules
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          make -C linux pocketbook_touch_lux_3_defconfig
          c=linux/scripts/config
          "$c" --file linux/.config \
            -e USB -e NOP_USB_XCEIV -e EXTCON -e PHY_SUN4I_USB \
            -e USB_MUSB_HDRC -e USB_MUSB_SUNXI \
            -e USB_GADGET -e USB_LIBCOMPOSITE -e USB_CONFIGFS \
            -e USB_CONFIGFS_ACM -e USB_CONFIGFS_MASS_STORAGE \
            -e USB_EHCI_HCD -e USB_EHCI_HCD_PLATFORM \
            -e USB_OHCI_HCD -e USB_OHCI_HCD_PLATFORM \
            -e MMC -e MMC_SUNXI -e EXT4_FS -e VFAT_FS \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e CONFIGFS_FS \
            -e REGULATOR_TP65185X -e BACKLIGHT_PWM \
            -e MEDIA_SUPPORT -e MEDIA_PLATFORM_SUPPORT -e VIDEO_DEV \
            -e TOUCHSCREEN_CYTTSP4_CORE -e TOUCHSCREEN_CYTTSP4_I2C \
            -e TOUCHSCREEN_ELAN -e TOUCHSCREEN_EDT_FT5X06 \
            -m FB_SUN5I_EINK -m RTL8XXXU
          # Megi's default reserves 128 MiB CMA from only 256 MiB RAM.
          "$c" --file linux/.config --set-val CMA_SIZE_MBYTES 32
          make -C linux olddefconfig
          for key in USB_MUSB_SUNXI USB_CONFIGFS USB_CONFIGFS_ACM MMC_SUNXI REGULATOR_TP65185X VIDEO_DEV; do
            grep -q "^CONFIG_$key=y$" linux/.config || { echo "Missing required built-in: $key"; exit 1; }
          done
          for key in FB_SUN5I_EINK RTL8XXXU; do
            grep -q "^CONFIG_$key=m$" linux/.config || { echo "Missing required module: $key"; exit 1; }
          done
          grep -q '^CONFIG_CMA_SIZE_MBYTES=32$' linux/.config
      - name: Cross-compile zImage, modules and four version-matched DTBs
        shell: bash
        run: |
          set -euo pipefail
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          make -C linux -j"$(nproc)" KCFLAGS=-Wno-error zImage modules
          mkdir -p dist
          cp linux/arch/arm/boot/zImage dist/pb626-megi-zImage
          bash scripts/build-megi-variants.sh linux dist "$PWD"
          cp linux/.config dist/pb626-megi.config
          cp KERNEL-SOURCE.txt dist/KERNEL-SOURCE.txt
          make -s -C linux kernelrelease > dist/KERNELRELEASE
      - name: Assemble Alpine rootfs and full RAM initramfs
        shell: bash
        run: |
          set -euo pipefail
          base=https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/armv7
          f=alpine-minirootfs-3.24.4-armv7.tar.gz
          curl -fsSL --retry 3 "$base/$f" -o "$f"
          curl -fsSL --retry 3 "$base/$f.sha256" -o "$f.sha256"
          sha256sum -c "$f.sha256"
          mkdir -p rootfs initramfs
          sudo tar --numeric-owner -xzf "$f" -C rootfs
          sudo install -d rootfs/usr/bin rootfs/dev rootfs/proc rootfs/sys rootfs/run rootfs/root rootfs/media/pb626-config
          test -e rootfs/dev/null || sudo mknod -m 666 rootfs/dev/null c 1 3
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/qemu-arm-static
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /usr/bin/qemu-arm-static /sbin/apk add --no-cache \
            kmod iw wpa_supplicant linux-firmware-rtlwifi \
            openssh-server openssh-keygen e2fsprogs usbutils i2c-tools v4l-utils
          sudo rm -f rootfs/usr/bin/qemu-arm-static
          sudo install -m 755 boot/pb626-init-megi rootfs/sbin/pb626-init
          sudo install -m 755 scripts/inspect-live.sh rootfs/usr/sbin/inspect-pb626
          echo pb626-external-alpine-v1 | sudo tee rootfs/etc/pb626-image-id >/dev/null
          printf 'nameserver 1.1.1.1\n' | sudo tee rootfs/etc/resolv.conf >/dev/null
          sudo chmod 1777 rootfs/tmp
          export ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf-
          # modules_install may append "-dirty" after the DTB variants are generated.
          # Pin the destination to the release embedded in the compiled zImage.
          kernel_release=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' linux/include/generated/utsrelease.h)
          test -n "$kernel_release"
          printf '%s\n' "$kernel_release" > dist/KERNELRELEASE
          sudo make -C linux modules_install KERNELRELEASE="$kernel_release" INSTALL_MOD_PATH="$PWD/rootfs" DEPMOD=true
          sudo depmod -b rootfs "$kernel_release"
          # The RAM initramfs is a full Alpine rootfs with matching modules.
          sudo cp -a rootfs/. initramfs/
          sudo install -m 755 boot/init-megi initramfs/init
          sudo install -m 755 scripts/inspect-live.sh initramfs/usr/sbin/inspect-pb626
          sudo install -m 755 scripts/probe-device.sh initramfs/usr/sbin/probe-pb626
          sudo mkdir -p initramfs/newroot initramfs/sys/kernel/config
          test -e initramfs/dev/null || sudo mknod -m 666 initramfs/dev/null c 1 3
          (cd initramfs && sudo find . -print0 | sudo cpio --null -o --format=newc --quiet) \
            | gzip -9 > dist/pb626-megi-initramfs.cpio.gz
          # The direct ARM stub does not apply U-Boot FDT fixups.
          initrd_start=$((0x45000000))
          initrd_size=$(stat -c '%s' dist/pb626-megi-initramfs.cpio.gz)
          initrd_end=$((initrd_start + initrd_size))
          test "$initrd_end" -lt $((0x50000000))
          for dtb in dist/pb626-*.dtb; do
            fdtput -t x "$dtb" /chosen linux,initrd-start "$(printf '%x' "$initrd_start")"
            fdtput -t x "$dtb" /chosen linux,initrd-end "$(printf '%x' "$initrd_end")"
            test "$(fdtget -t x "$dtb" /chosen linux,initrd-start)" = "$(printf '%x' "$initrd_start")"
            test "$(fdtget -t x "$dtb" /chosen linux,initrd-end)" = "$(printf '%x' "$initrd_end")"
            test "$(fdtget -t s "$dtb" /soc/mmc@1c11000 status)" = disabled
          done
          # An ordinary persistent rootfs archive can be prepared later,
          # but remains independent of the default RAM-only boot.
          sudo tar -C rootfs -czf dist/pb626-megi-rootfs.tar.gz .
          sudo tar -C rootfs -czf dist/pb626-megi-modules.tar.gz lib/modules
          sudo chown -R "$USER:$USER" dist
      - name: Verify build outputs and publish checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pb626-megi-zImage
          test -s dist/pb626-megi-initramfs.cpio.gz
          test -s dist/pb626-megi-rootfs.tar.gz
          test "$(find dist -maxdepth 1 -name 'pb626-*.dtb' | wc -l)" -eq 4
          gzip -cd dist/pb626-megi-initramfs.cpio.gz | cpio -t 2>/dev/null | grep -Fx './init' >/dev/null
          test -s dist/KERNEL-SOURCE.txt
          test -x initramfs/usr/bin/v4l2-ctl
          (cd dist && sha256sum pb626-megi-zImage *.dtb *.gz *.config > SHA256SUMS)
          cat > dist/README.txt <<'NOTE'
          EXPERIMENTAL FULL RAM ALPINE. NEVER FLASH THE INTERNAL EMMC.
          Source: Megi mainline Linux 7.2 (2026-09-03), commit facc87117511221bb61410e3f92ad8579697f736.
          2026 timer reload and minimum-delta fixes are ALREADY included upstream.
          Select one DTB: cypress / elan / focaltech / no-touch.
          ELAN/FocalTech protocols unverified. E Ink requires waveform-aware userspace.
          Full RAM Alpine initramfs includes matching modules and USB ACM shell.
          Use zImage + initramfs + DTB with the proven FEL SPL/entry loader.
          Future rootfs handoff is explicitly opt-in; no SD disk image is generated.
          NOTE
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-mainline-7.2-ram-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
