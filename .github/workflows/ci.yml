name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Hardware probe checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure shellcheck is available
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
      - name: Validate shell syntax
        run: |
          sh -n scripts/probe-device.sh
          sh -n tests/probe-smoke.sh
          sh -n scripts/inspect-live.sh
          sh -n scripts/pb626-network.sh
          sh -n boot/init-megi
          for f in boot/pb626-native-{setup,desktop,console} display/pb626-{desktop,xsession}; do sh -n "$f"; done
          bash -n scripts/fel-boot.sh
          bash -n scripts/configure-megi-kernel.sh
          bash -n scripts/build-alpine-rootfs.sh
          bash -n scripts/build-megi-desktop.sh
          bash -n scripts/build-megi-variants.sh
          bash -n scripts/assemble-megi-ram.sh
          grep -Fqx 'hostname pb626 2>/dev/null || true' boot/init-megi
          shellcheck -s sh scripts/probe-device.sh tests/probe-smoke.sh scripts/inspect-live.sh scripts/pb626-network.sh
          shellcheck -s bash scripts/fel-boot.sh
      - name: Test hardware inventory
        run: sh tests/probe-smoke.sh
      - name: Test offline firmware image builder
        run: python3 tests/test-native-image.py

  bt0-hook:
    name: BT0-uncaged hook build and model tests (no base SPL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM assembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Assemble exact early Menu hook
        run: |
          set -euo pipefail
          clang --target=armv7a-none-eabi -c BT0-uncaged/early-menu.S -o /tmp/menu.o
          ld.lld -Ttext=0x5000 -e _start /tmp/menu.o -o /tmp/menu.elf
          llvm-objcopy -O binary -j .text /tmp/menu.elf /tmp/menu.raw
          python3 BT0-uncaged/test_hook.py --hook-only /tmp/menu.raw
          python3 -m py_compile BT0-uncaged/build.py BT0-uncaged/pack-kernel.py
