name: Lima GLES2 RAM overlay

on:
  push:
    branches: [experiment/lima-gles2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lima-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armv7:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build and verify the Alpine armv7 overlay
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            alpine:3.24 sh /src/scripts/build-lima-demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-lima-armv7
          path: dist/
          if-no-files-found: error
