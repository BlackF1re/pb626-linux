name: Alpine microSD image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sd-image.yml'
      - 'scripts/make-sd-image.sh'
      - 'boot/pb626-init'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Alpine ARMv7 microSD image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static fdisk e2fsprogs dosfstools mtools
      - name: Download verified Alpine minirootfs
        shell: bash
        run: |
          set -euo pipefail
          base=https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/armv7
          file=alpine-minirootfs-3.24.4-armv7.tar.gz
          curl -fsSL --retry 3 "$base/$file" -o "$file"
          curl -fsSL --retry 3 "$base/$file.sha256" -o "$file.sha256"
          sha256sum -c "$file.sha256"
          mkdir rootfs
          sudo tar --numeric-owner -xzf "$file" -C rootfs
      - name: Populate ARMv7 root filesystem
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p rootfs/usr/bin rootfs/dev rootfs/proc rootfs/sys rootfs/run rootfs/root rootfs/media/pb626-config rootfs/dev/pts
          if [ ! -e rootfs/dev/null ]; then sudo mknod -m 666 rootfs/dev/null c 1 3; fi
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/qemu-arm-static
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /usr/bin/qemu-arm-static /sbin/apk add --no-cache \
            iw wpa_supplicant linux-firmware-rtlwifi kmod usbutils \
            openssh-server openssh-keygen htop e2fsprogs
          sudo rm -f rootfs/usr/bin/qemu-arm-static
          sudo install -m 755 boot/pb626-init rootfs/sbin/pb626-init
          printf 'pb626-external-alpine-v1\n' | sudo tee rootfs/etc/pb626-image-id >/dev/null
          printf 'pb626-alpine\n' | sudo tee rootfs/etc/hostname >/dev/null
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee rootfs/etc/resolv.conf >/dev/null
          sudo chmod 1777 rootfs/tmp
          test -x rootfs/sbin/pb626-init
          test -x rootfs/usr/sbin/sshd || test -x rootfs/sbin/sshd
          test -x rootfs/usr/sbin/wpa_supplicant || test -x rootfs/sbin/wpa_supplicant
          test "$(cat rootfs/etc/pb626-image-id)" = pb626-external-alpine-v1
          find rootfs/usr/sbin rootfs/sbin -maxdepth 1 \( -name sshd -o -name wpa_supplicant \) -print
      - name: Build and validate partitioned microSD image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          sudo bash scripts/make-sd-image.sh rootfs dist/pb626-alpine-sd.img
          sudo gzip -n -1 dist/pb626-alpine-sd.img
          sudo chown -R "$USER:$USER" dist
          (cd dist && sha256sum *.img.gz > SHA256SUMS)
          cat > dist/README.txt <<'EOF'
          REMOVABLE MICROSD IMAGE ONLY. NEVER WRITE TO THE POCKETBOOK EMMC.
          Partition 1: ext4 Alpine root for FEL-booted kernel.
          Partition 2: PB626CFG FAT32 (optional wifi.conf).
          Kernel, initramfs, SPL and FEL uploader are NOT included.
          Before boot, use your proven RAM-only FEL loader.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: pb626-alpine-sd-image
          path: dist/
          if-no-files-found: error
          retention-days: 14
